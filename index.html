<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Scoot War</title>
<link rel="icon" type="image/png" href="scootwar-icon-192.png">
<link rel="alternate icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect width='120' height='120' rx='26' fill='%23faf8f3'/%3E%3Ctext x='60' y='80' text-anchor='middle' font-family='Georgia,serif' font-weight='700' font-size='72' fill='%23141210'%3EW%3C/text%3E%3Crect x='30' y='90' width='60' height='5' fill='%23141210'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="scootwar-icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2a1f12">
<meta name="apple-mobile-web-app-title" content="Scoot War">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;600;800&family=IM+Fell+English:ital@0;1&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#15120e;--panel:#221d16;--panel2:#2c261d;--line:#3d3427;--gold:#e0b15a;--gold2:#f3cf86;--text:#f1e8d6;--dim:#b3a68d;--red:#c9553b;--green:#7fb069;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
canvas#game{position:fixed;inset:0;width:100vw;height:100vh;image-rendering:pixelated;display:block;touch-action:none}
.hidden{display:none!important}
button{font-family:inherit}
.btn{background:linear-gradient(#3a3125,#2a231a);color:var(--text);border:2px solid var(--line);border-radius:12px;padding:12px 18px;font-weight:800;font-size:15px;cursor:pointer;letter-spacing:.3px;box-shadow:0 3px 0 #0008}
.btn:hover{border-color:var(--gold)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #0008}
.btn.primary{background:linear-gradient(#e9be6a,#c99540);color:#22180a;border-color:#f3cf86}
.btn.small{padding:7px 12px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.4;cursor:default}
/* title */
#title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;
 background:radial-gradient(ellipse at 50% 30%,#3a2a17 0%,#1a140d 55%,#0d0a07 100%)}
#title canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
#title .inner{position:relative;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;padding:20px}
#title h1{font-family:Cinzel,serif;font-weight:900;font-size:clamp(46px,11vw,96px);margin:0;color:var(--gold2);letter-spacing:6px;text-shadow:0 4px 0 #5b3d14,0 10px 30px #000}
#title .sub{color:var(--dim);font-weight:600;letter-spacing:3px;text-transform:uppercase;font-size:13px;margin-bottom:18px}
#title .menu{display:flex;flex-direction:column;gap:10px;width:min(300px,80vw)}
#title .menu .btn{font-size:17px;padding:14px}
#title .ver{position:absolute;bottom:12px;left:0;right:0;text-align:center;color:#7d705a;font-size:12px}
/* panels */
.overlay{position:fixed;inset:0;z-index:60;background:#0d0a07ee;display:flex;align-items:center;justify-content:center;padding:14px}
.card{background:var(--panel);border:2px solid var(--line);border-radius:16px;width:min(860px,100%);max-height:100%;display:flex;flex-direction:column;box-shadow:0 20px 60px #000}
.card .head{padding:16px 20px;border-bottom:2px solid var(--line);display:flex;align-items:center;gap:12px}
.card .head h2{font-family:Cinzel,serif;margin:0;font-size:22px;color:var(--gold2);flex:1}
.card .body{padding:18px 20px;overflow:auto;flex:1}
.card .foot{padding:12px 20px;border-top:2px solid var(--line);display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.steps{color:var(--dim);font-size:12px;font-weight:600}
label.f{display:block;font-weight:800;font-size:13px;color:var(--gold);margin:14px 0 6px;text-transform:uppercase;letter-spacing:1px}
label.f:first-child{margin-top:0}
input[type=text],textarea{width:100%;background:#120f0b;color:var(--text);border:2px solid var(--line);border-radius:10px;padding:10px 12px;font:600 15px Inter,sans-serif}
textarea{min-height:70px;resize:vertical}
input[type=range]{accent-color:var(--gold)}
input:focus,textarea:focus{outline:none;border-color:var(--gold)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.opt{background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.opt b{display:block;font-size:14px;margin-bottom:3px}
.opt span{font-size:12px;color:var(--dim);line-height:1.35;display:block}
.opt.sel{border-color:var(--gold);background:#3a2f1f}
.opt.dis{opacity:.4}
select{font-family:Inter,sans-serif}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg .opt{padding:7px 12px}
.seg .opt b{margin:0;font-size:13px}
.lawrow{display:grid;grid-template-columns:150px 1fr;gap:8px;align-items:center;margin-bottom:8px}
.lawrow .n{font-weight:700;font-size:13px}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.sw div{width:34px;height:34px;border-radius:8px;border:3px solid transparent;cursor:pointer}
.sw div.sel{border-color:#fff}
.sym{display:flex;gap:6px;flex-wrap:wrap}
.sym div{width:44px;height:44px;border-radius:10px;background:var(--panel2);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer}
.sym div.sel{border-color:var(--gold)}
.row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.row>.col{flex:1;min-width:220px}
.stat{display:grid;grid-template-columns:110px 34px 1fr 34px;gap:6px;align-items:center;margin-bottom:6px}
.stat .v{text-align:center;font-weight:800}
.bar{height:8px;background:#120f0b;border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold)}
.note{color:var(--dim);font-size:13px;line-height:1.45}
.sum{display:grid;grid-template-columns:150px 1fr;gap:4px 10px;font-size:13px}
.sum b{color:var(--gold)}
/* HUD */
#hud{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;gap:6px;padding:8px;align-items:flex-start;pointer-events:none;flex-wrap:wrap}
.chip{background:#151109dd;border:2px solid #3d3427;border-radius:10px;padding:6px 10px;font-weight:800;font-size:13px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.chip small{color:var(--dim);font-weight:600}
#hudBanner{width:22px;height:30px;border-radius:3px 3px 8px 8px;display:flex;align-items:center;justify-content:center;font-size:13px}
#hudMenu{pointer-events:auto;margin-left:auto}
#minimap{position:fixed;right:8px;top:54px;z-index:20;border:2px solid #3d3427;border-radius:8px;width:150px;image-rendering:pixelated;background:#000}
#prompt{position:fixed;left:50%;bottom:22%;transform:translateX(-50%);z-index:21;background:#151109ee;border:2px solid var(--gold);border-radius:12px;padding:8px 14px;font-weight:800;font-size:14px;pointer-events:auto;cursor:pointer}
#prompt.soft{border-color:#3d3427;color:var(--dim)}
#prompt kbd{background:var(--gold);color:#22180a;border-radius:5px;padding:1px 7px;margin-right:6px}
#advisor{position:fixed;left:8px;top:54px;z-index:20;width:min(330px,62vw);background:#151109ee;border:2px solid #3d3427;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.4}
#advisor .who{font-weight:800;color:var(--gold);font-size:12px;text-transform:uppercase;letter-spacing:1px;display:flex;justify-content:space-between}
#advisor .who button{background:none;border:0;color:var(--dim);cursor:pointer;font-weight:800}
#advisor .task{margin-top:6px;font-weight:700}
#toast{position:fixed;left:50%;top:60px;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:#151109f2;border:2px solid var(--gold);border-radius:10px;padding:8px 14px;font-weight:700;font-size:13px;animation:tin .25s ease-out;max-width:90vw;text-align:center}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
/* game menu */
#gmenu .card{width:min(1000px,100%);height:min(680px,100%)}
#gmenu .wrap{display:flex;flex:1;min-height:0}
#gtabs{width:190px;border-right:2px solid var(--line);overflow:auto;padding:8px}
#gtabs button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--text);padding:9px 10px;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer}
#gtabs button.sel{background:#3a2f1f;color:var(--gold2)}
#gtabs button .lock{color:var(--dim);font-size:11px;float:right}
#gbody{flex:1;overflow:auto;padding:18px 20px}
#gbody h3{font-family:Cinzel,serif;color:var(--gold2);margin:0 0 12px;font-size:20px}
#gbody h4{margin:16px 0 8px;color:var(--gold);font-size:13px;text-transform:uppercase;letter-spacing:1px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t td,table.t th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
table.t th{color:var(--dim);font-weight:600;font-size:12px;text-transform:uppercase}
.pos{color:var(--green)} .neg{color:var(--red)}
.soon{background:var(--panel2);border:2px dashed var(--line);border-radius:12px;padding:16px;color:var(--dim);font-size:14px;line-height:1.5}
.chron div{padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.chron b{color:var(--gold)}
.slots{display:grid;gap:8px}
.slot{background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px}
.slot .i{flex:1;font-size:13px}
.slot .i b{display:block;font-size:14px}
/* modal */
#modal .card{width:min(560px,100%)}
#modal .body p{margin:0 0 10px;line-height:1.5;font-size:14px}
.stone{background:#8f887b;color:#2a251d;border-radius:8px;padding:16px;font-family:Cinzel,serif;text-align:center;border:4px solid #6d675c;box-shadow:inset 0 0 20px #0004}
.stone .ln{font-size:20px;font-weight:900;margin-bottom:8px;letter-spacing:2px}
.stone .tx{font-size:15px;font-weight:700;line-height:1.5}
/* touch */
#touch{position:fixed;inset:0;z-index:15;pointer-events:none}
#stick{position:absolute;left:24px;bottom:28px;width:130px;height:130px;border-radius:50%;background:#0006;border:2px solid #fff3;pointer-events:auto;touch-action:none}
#knob{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;background:#e0b15acc;border:2px solid #fff6}
#tbtns{position:absolute;right:20px;bottom:30px;display:flex;gap:10px;pointer-events:auto}
#tbtns button{width:64px;height:64px;border-radius:50%;background:#151109dd;border:2px solid var(--gold);color:var(--text);font-weight:800;font-size:13px}

#bUI{position:fixed;inset:0;z-index:25;pointer-events:none}
#nUI,#rUI{position:fixed;inset:0;z-index:25;pointer-events:none}
.xTop{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#151109e6;border:2px solid var(--line);border-radius:10px;padding:7px 14px;font:800 13px Inter,sans-serif;white-space:nowrap}
.xMsg{position:absolute;top:58px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;width:min(560px,92vw);text-align:center}
.xMsg div{background:#151109dd;border:1px solid #3d3427;border-radius:8px;padding:4px 10px;font-size:12px;font-weight:700}
.xMsg div:first-child{border-color:var(--gold)}
#rMsg{background:#151109dd;border:1px solid #3d3427;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700}
#bTop{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;pointer-events:none}
#bTitle{background:#151109e8;border:2px solid #3d3427;border-radius:10px;padding:6px 12px;font-family:Cinzel,serif;font-weight:900;color:var(--gold2);font-size:16px;margin-right:auto}
#bTitle small{display:block;font-family:Inter,sans-serif;font-weight:600;color:var(--dim);font-size:11px}
#bTop button,#bOrders button,#bDeploy button{pointer-events:auto;background:linear-gradient(#3a3125,#2a231a);color:var(--text);border:2px solid var(--line);border-radius:9px;padding:7px 11px;font:800 13px Inter,sans-serif;cursor:pointer}
#bTop button:hover,#bOrders button:hover,#bDeploy button:hover{border-color:var(--gold)}
#bBegin{background:linear-gradient(#e9be6a,#c99540)!important;color:#22180a!important;border-color:#f3cf86!important}
#bMsg{position:absolute;top:64px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px}
#bMsg div{background:#151109dd;border:1px solid #3d3427;border-radius:8px;padding:4px 10px;font-size:12px;font-weight:700}
#bMsg div:first-child{border-color:var(--gold);font-size:13px}
#bMsg div:nth-child(n+3){opacity:.6}
#bDeploy{position:absolute;left:50%;transform:translateX(-50%);bottom:150px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;pointer-events:none;max-width:96vw}
#bDeploy span{background:#151109dd;border-radius:8px;padding:7px 10px;font-weight:800;font-size:12px;color:var(--dim)}
#bBottom{position:absolute;left:0;right:0;bottom:0;padding:8px;background:linear-gradient(transparent,#0d0a07ee 30%);pointer-events:none}
#bCards{display:flex;gap:6px;overflow-x:auto;pointer-events:auto;padding-bottom:4px}
.bc{position:relative;min-width:104px;background:#221d16f2;border:2px solid #3d3427;border-radius:10px;padding:6px 8px 9px;cursor:pointer;flex-shrink:0}
.bc b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.bc span{font-size:12px;color:var(--dim);font-weight:700}
.bc i{position:absolute;left:6px;bottom:4px;height:3px;border-radius:2px;max-width:calc(100% - 12px)}
.bc.sel{border-color:var(--gold);background:#3a2f1ff2}
.bc.dead{opacity:.45}
#bOrders{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;pointer-events:auto;align-items:center}
#bOrders .hint{font-size:12px;color:var(--dim);font-weight:700}
@media (max-width:700px){#bMsg{top:120px;width:90vw}#bTitle{font-size:13px;width:100%}#bTop button{padding:6px 9px;font-size:12px}#bOrders button{padding:6px 8px;font-size:12px}#bDeploy{bottom:170px}}
#susp{position:fixed;left:50%;top:96px;transform:translateX(-50%);z-index:21;background:#151109ee;border:2px solid #3d3427;border-radius:10px;padding:6px 12px;font-weight:800;font-size:13px;width:220px}
#susp i{display:block;height:6px;border-radius:3px;margin-top:4px}
#portrait{image-rendering:pixelated;border:2px solid var(--line);border-radius:10px;background:#120f0b}
@media (max-width:700px){
 #gmenu .wrap{flex-direction:column}
 #gtabs{width:auto;display:flex;overflow-x:auto;border-right:0;border-bottom:2px solid var(--line);padding:6px}
 #gtabs button{white-space:nowrap;width:auto}
 #gtabs button .lock{display:none}
 .lawrow{grid-template-columns:1fr}
 #minimap{width:96px;top:96px}
 #advisor{top:auto;bottom:180px;width:calc(100vw - 16px);font-size:12px;padding:8px 10px}
 #toast{top:200px}
 .chip{font-size:12px;padding:5px 8px}
 .sum{grid-template-columns:120px 1fr}
}
/* ===== BUILD 19: PARCHMENT AND BRONZE ===== */
:root{--panel:#ecdcb6;--panel2:#e4d1a6;--line:#a8875a;--gold:#7a5420;--gold2:#6a1f14;--text:#2a1f12;--dim:#6a5a40;--red:#9a2a1c;--green:#3f6a22;--ink:#2a1f12;--bronze:#8a6a3a;--bronze2:#b08a4a;--paper:#ecdcb6;--paperD:#ddc596}
.btn{background:#e8d6aa;color:var(--ink);border:2px solid var(--bronze);border-radius:6px;box-shadow:0 2px 0 #6a4a22;font-family:'Libre Caslon Text',Georgia,serif;font-weight:700;letter-spacing:.2px}
.btn:hover{border-color:#6a4a1a;background:#f0e0b8}
.btn:active{box-shadow:0 0 0 #6a4a22}
.btn.primary{background:#8a6a3a;color:#f6ead0;border-color:#5a4022}
.btn.primary:hover{background:#7a5a2e}
.btn:disabled{opacity:.45}
.overlay{background:#1a120acc}
.card{background:var(--paper);border:2px solid var(--bronze);border-radius:4px;outline:1px solid #c9a86a;outline-offset:-7px;box-shadow:0 18px 50px #000a;color:var(--ink);background-image:radial-gradient(ellipse at 50% 40%,transparent 55%,#b8955a33 100%)}
.card .head{border-bottom:1.5px solid var(--bronze)}
.card .head h2{font-family:Cinzel,serif;color:var(--gold2);font-weight:900;letter-spacing:.5px}
.card .foot{border-top:1.5px solid var(--bronze)}
.card .body,#gbody{scrollbar-color:#a8875a transparent}
#modal .body p{font-family:'Libre Caslon Text',Georgia,serif;font-size:14.5px}
.note{color:var(--dim)}
input[type=text],textarea{background:#f6ecd2;color:var(--ink);border:1.5px solid var(--bronze);border-radius:4px;font-family:'Libre Caslon Text',Georgia,serif}
.opt{background:#f1e4c3;border:1.5px solid #b89a6a;border-radius:6px}
.opt.sel{border-color:#6a4a1a;background:#e2c98f;box-shadow:inset 0 0 0 1px #6a4a1a}
.opt b{font-family:'Libre Caslon Text',Georgia,serif}
.sym div{background:#f1e4c3;border-color:#b89a6a}.sym div.sel{border-color:#6a4a1a;background:#e2c98f}
.sw div.sel{border-color:var(--ink)}
.bar{background:#d6c194;border:1px solid #a8875a}.bar i{background:var(--bronze)}
.slot{background:#f1e4c3;border:1.5px solid #b89a6a;border-radius:6px}
.soon{background:#f1e4c3;border-color:#b89a6a}
table.t td,table.t th{border-bottom:1px solid #c4a878}
table.t th{color:var(--gold)}
.chron div{border-bottom:1px solid #c4a878}
.sum b{color:var(--gold)}
#gbody h3{color:var(--gold2);font-weight:900}
#gbody h4{color:var(--gold)}
.stone{background:#cfc6b2}
/* scroll menu */
#gmenu .card{position:relative;width:min(980px,96vw);height:min(700px,92vh);border-radius:2px;outline:none;border:none;border-left:2px solid #b8955a;border-right:2px solid #b8955a;overflow:visible;background-color:#ecdcb6}
#gmenu .card:before,#gmenu .card:after{content:"";position:absolute;left:-18px;right:-18px;height:20px;border-radius:10px;background:linear-gradient(#8a5f34,#5a3a1c 55%,#3e2812);box-shadow:0 3px 6px #0008;z-index:2}
#gmenu .card:before{top:-12px}#gmenu .card:after{bottom:-12px}
#gmenu .head{padding-top:18px}
#gmenu .head .steps{color:var(--dim)}
#gmenu .wrap{flex-direction:column}
#gsub{display:flex;gap:4px;padding:8px 18px 0;border-bottom:1px solid #b8955a;overflow-x:auto;flex-shrink:0}
#gsub button{background:none;border:0;border-bottom:3px solid transparent;padding:7px 12px;font:700 14px 'Libre Caslon Text',Georgia,serif;color:var(--dim);cursor:pointer;white-space:nowrap}
#gsub button.sel{color:var(--ink);border-bottom-color:var(--bronze)}
#gtabs{width:auto;border:0;border-top:1.5px solid var(--bronze);display:flex;justify-content:center;gap:4px;padding:8px 10px 18px;overflow-x:auto;flex-shrink:0;order:3}
#gtabs button{display:flex;flex-direction:column;align-items:center;gap:2px;width:auto;min-width:78px;padding:6px 8px;border-radius:4px;font:700 12px Cinzel,serif;color:var(--dim);letter-spacing:.5px}
#gtabs button svg{width:22px;height:22px}
#gtabs button.sel{background:#8a6a3a;color:#f6ead0}
#gbody{order:2}
/* HUD bar */
#hud{padding:6px 8px;gap:0;flex-direction:column;align-items:stretch}
#pbar{pointer-events:auto;display:flex;align-items:center;gap:12px;background:#e8d9b5;color:var(--ink);border:2px solid var(--bronze);outline:1px solid #c9a86a;outline-offset:-5px;border-radius:3px;padding:5px 10px;box-shadow:0 3px 10px #0006;font-family:'Libre Caslon Text',Georgia,serif;cursor:default}
#pbar .nm{display:flex;align-items:center;gap:7px;font:700 14px Cinzel,serif;white-space:nowrap}
#pbar .st{display:flex;gap:14px;flex:1;justify-content:center;flex-wrap:nowrap;overflow:hidden}
#pbar .s{display:flex;align-items:center;gap:4px;font-weight:700;font-size:14px;white-space:nowrap}
#pbar .s svg{width:17px;height:17px;flex:none}
#pbar .d{font:600 10px Inter,sans-serif}
#pbar .d.up{color:#3f6a22}#pbar .d.dn{color:#a8322a}
#pbar .s.low{color:#a8322a}

const tbg=$('#titleBg'), tctx=tbg.getContext('2d');
let titleT=0, titleOn=true;
function drawTitleBg(){
 if(!titleOn)return;
 const w=tbg.width=Math.ceil(innerWidth/4), h=tbg.height=Math.ceil(innerHeight/4);
 titleT+=1;
 tctx.clearRect(0,0,w,h);
 const hy=h*0.72;
 tctx.fillStyle='#2a1d10';tctx.beginPath();tctx.moveTo(0,h);for(let x=0;x<=w;x+=4)tctx.lineTo(x,hy-10*Math.sin(x*0.02)-6*Math.sin(x*0.05+1));tctx.lineTo(w,h);tctx.fill();
 tctx.fillStyle='#1d140b';tctx.beginPath();tctx.moveTo(0,h);for(let x=0;x<=w;x+=4)tctx.lineTo(x,hy+12-6*Math.sin(x*0.03+2));tctx.lineTo(w,h);tctx.fill();
 for(let i=0;i<40;i++){
  const x=((i*14+titleT*0.25)%(w+60))-30, y=hy+10-6*Math.sin(x*0.03+2)-2;
  const bob=Math.floor((titleT*0.1+i)%2);
  tctx.fillStyle='#0e0a06';
  tctx.fillRect(x,y-7-bob,3,5);tctx.fillRect(x+0.5,y-9-bob,2,2);tctx.fillRect(x+(bob?0:2),y-2,1,2);tctx.fillRect(x+(bob?2:0),y-2,1,2);
  tctx.fillRect(x+3,y-15,1,12);
  if(i%5===0){tctx.fillStyle='#7a2a1a';tctx.fillRect(x+4,y-15,4,3);}
 }
 requestAnimationFrame(drawTitleBg);
}

/* ================= SAVE ================= */
const SLOTS=['auto','1','2','3'];
function slotKey(s){return 'scootwar_slot_'+s;}
function readSlot(s){try{const r=localStorage.getItem(slotKey(s));return r?JSON.parse(r):null;}catch(e){return null;}}
function writeSlot(s,data){try{localStorage.setItem(slotKey(s),JSON.stringify(data));return true;}catch(e){return false;}}
function packSave(){return {v:2,saved:Date.now(),G:G};}
function syncPlayer(){if(G.scene==='battle')return;if(G.scene==='foreign'&&foreignSett){G.player={x:(foreignSett.x+1.4)*WT,y:(foreignSett.y+1)*WT,mounted:true};return;}G.player={x:player.x,y:player.y,mounted:player.mounted};}
function saveTo(s){syncPlayer();if(typeof WORLD!=='undefined'&&WORLD&&WORLD.exp)saveExp();const ok=writeSlot(s,packSave());toast(ok?(s==='auto'?'Auto-saved':'Saved to slot '+s):'Could not save (browser storage blocked)');return ok;}
function latestSave(){let best=null;for(const s of SLOTS){const d=readSlot(s);if(d&&d.G&&(!best||d.saved>best.saved))best=d;}return best;}
function slotLabel(d){if(!d||!d.G)return null;const g=d.G;return {name:g.faction.name+' — '+g.ruler.name,sub:'Year '+yearOf(g.time.day)+', '+SEASONS[seasonOf(g.time.day)]+(g.scene&&g.scene!=='city'?' · on campaign':'')+' · saved '+new Date(d.saved).toLocaleString()};}

const DAYS_PER_SEASON=10;
function seasonOf(day){return Math.floor((day-1)/DAYS_PER_SEASON)%4;}
function yearOf(day){return Math.floor((day-1)/(DAYS_PER_SEASON*4))+1;}
function dayInSeason(day){return ((day-1)%DAYS_PER_SEASON)+1;}
function clockStr(min){const h=Math.floor(min/60),m=Math.floor(min%60/10)*10;return (h%12||12)+':'+String(m).padStart(2,'0')+(h<12?' am':' pm');}
const isNight=()=>G.time.min>=20*60||G.time.min<5*60;

const SOLID=new Uint8Array(20);[4,5,7,9,10,12,14].forEach(t=>SOLID[t]=1);

function newLocal(kind,hl,mat){
 const tiles=new Uint8Array(MW*MH), bid=new Int16Array(MW*MH).fill(-1);
 const m={kind,tiles,bid,buildings:[],villages:[],lights:[],gates:[],ships:[],hl,mat,fieldCount:0,canvas:null,season:-1,mini:null};
 const I=(x,y)=>y*MW+x;
 m.inb=(x,y)=>x>=0&&y>=0&&x<MW&&y<MH;
 m.get=(x,y)=>m.inb(x,y)?tiles[I(x,y)]:TL.ROCK;
 m.set=(x,y,t)=>{if(m.inb(x,y))tiles[I(x,y)]=t;};
 m.addB=(type,x,y,ww,hh,name,extra)=>{const b=Object.assign({id:m.buildings.length,type,x,y,w:ww,h:hh,name},extra||{});for(let yy=y;yy<y+hh;yy++)for(let xx=x;xx<x+ww;xx++){m.set(xx,yy,TL.BUILD);if(m.inb(xx,yy))bid[I(xx,yy)]=b.id;}m.buildings.push(b);return b;};
 m.blob=(R,cx,cy,r,t,ground)=>{for(let y=cy-r-2;y<=cy+r+2;y++)for(let x=cx-r-2;x<=cx+r+2;x++){const d=Math.hypot(x-cx,y-cy)+(hash(x,y,7)-.5)*3;if(d<r&&m.get(x,y)===ground)m.set(x,y,t);}};
 return m;
}

/* ---- camp ---- */
function campHL(wx,wy){
 const t=WORLD.t[wy*WM.w+wx], lat=yToLat(wy+.5), lon=xToLon(wx+.5);
 if(t===WTT.DESERT)return Object.assign({},HOMELANDS.africa,{forest:.08,rock:.8,snow:false});
 if(t===WTT.FOREST)return Object.assign({},HOMELANDS.thrace,{forest:2.4,snow:lat>40,tree:lat<39?'oak':'pine'});
 if(t===WTT.STEPPE)return {grass:['#93a850','#b8a860','#a89a58','#e9eef0'],tree:'oak',roof:'#9c8248',rock:.3,forest:.12,snow:lat>44};
 if(t===WTT.HILLS||t===WTT.MOUNT)return Object.assign({},HOMELANDS.greece,{rock:t===WTT.MOUNT?3:2,forest:.6,snow:lat>39||t===WTT.MOUNT,tree:lat>42?'pine':'olive'});
 if(lat<33&&(lon>12||lon<-3))return Object.assign({},HOMELANDS.africa,{forest:.3});
 return Object.assign({},HOMELANDS.italy,{snow:lat>41,tree:lat<38.5?'olive':'oak',forest:t===WTT.MARSH?.6:.8});
}
function genCamp(g,wx,wy,seed){
 const hl=campHL(wx,wy);

 for(let i=0;i<Math.round(8*hl.rock);i++)m.blob(R,Math.floor(R()*MW),Math.floor(R()*MH),1+Math.floor(R()*3),TL.ROCK,GR);
 for(let i=0;i<220*hl.forest;i++){const x=Math.floor(R()*MW),y=Math.floor(R()*MH);if(get(x,y)===GR)set(x,y,TL.TREE);}
 if(WORLD.t[wy*WM.w+wx]===WTT.MARSH||WORLD.t[wy*WM.w+wx]===WTT.RIVER){for(let i=0;i<10;i++)m.blob(R,Math.floor(R()*MW),Math.floor(R()*MH),2+Math.floor(R()*4),TL.WATER,GR);}
 const army=G.field.active?armyMen():0;
 const hw=army?Math.min(24,12+Math.ceil(army/60)):7, hh=army?Math.min(17,9+Math.ceil(army/90)):5;
 const cx=85,cy=65,x0=cx-hw,x1=cx+hw,y0=cy-hh,y1=cy+hh;
 m.C={cx,cy,x0,x1,y0,y1};
 for(let y=y0-8;y<=y1+8;y++)for(let x=x0-8;x<=x1+8;x++)set(x,y,GR);
 // road through camp
 for(let y=0;y<MH;y++)for(let d=-1;d<=1;d++)if(Math.abs(y-cy)>hh+8||true){const t=get(cx+d,y);if(t!==TL.WATER)set(cx+d,y,TL.ROAD);}
 for(let x=x0+1;x<x1;x++)for(let d=-1;d<=1;d++)set(x,cy+d,TL.DIRT);
 if(army){
  for(let x=x0;x<=x1;x++){set(x,y0,TL.WALL);set(x,y1,TL.WALL);}
  for(let y=y0;y<=y1;y++){set(x0,y,TL.WALL);set(x1,y,TL.WALL);}
  for(const [gy,oy,nm] of [[y0,-1,'North Gate'],[y1,1,'South Gate']]){for(let d=-1;d<=1;d++)set(cx+d,gy,TL.GATE);m.gates.push({name:nm,x:cx+.5,y:gy+.5,ox:0,oy});}
  for(let d=-1;d<=1;d++){set(x0,cy+d,TL.GATE);set(x1,cy+d,TL.GATE);}
  m.gates.push({name:'West Gate',x:x0+.5,y:cy+.5,ox:-1,oy:0},{name:'East Gate',x:x1+.5,y:cy+.5,ox:1,oy:0});
  for(const gt of m.gates){m.lights.push({x:gt.x+(gt.oy?-2:gt.ox*1.2),y:gt.y+(gt.ox?-2:gt.oy*1.2),r:55},{x:gt.x+(gt.oy?2:gt.ox*1.2),y:gt.y+(gt.ox?2:gt.oy*1.2),r:55});}
 }
 const ct=addB('cmdtent',cx-4,cy-8,9,6,'Command Tent');m.lights.push({x:cx+.5,y:cy-1.4,r:70});
 addB('wagons',cx+5,cy+3,5,3,'Supply Wagons');

 else{addB('fire',cx-1,cy+4,2,2,'Campfire',{big:true});m.lights.push({x:cx,y:cy+5,r:110});}
 // tents and fires

 for(let y=y0+2;y<y1-2&&placed<want;y+=4)for(let x=x0+2;x<x1-3&&placed<want;x+=5){
  let ok=true;for(let yy=y-1;yy<=y+2&&ok;yy++)for(let xx=x-1;xx<=x+3;xx++){if(get(xx,yy)!==GR){ok=false;break;}}
  if(ok){tents.push(addB('tent',x,y,3,2,'Tent'));placed++;}
 }
 if(!army&&placed<2){for(const [x,y] of [[cx-6,cy+1],[cx+3,cy+1]]){let ok=true;for(let yy=y;yy<y+2;yy++)for(let xx=x;xx<x+3;xx++)if(get(xx,yy)!==GR&&get(xx,yy)!==TL.DIRT)ok=false;if(ok)tents.push(addB('tent',x,y,3,2,'Tent'));}}
 m.fires=[];
 for(let y=y0+4;y<y1-1;y+=8)for(let x=x0+4;x<x1-2;x+=10){

 }
 m.fires.push(...m.buildings.filter(b=>b.type==='fire'&&b.big));
 return m;
}

/* ================= WORLD MAP GEN ================= */
function bbox(p){let a=1e9,b=1e9,c=-1e9,d=-1e9;for(const q of p){a=Math.min(a,q[0]);b=Math.min(b,q[1]);c=Math.max(c,q[0]);d=Math.max(d,q[1]);}return [a,b,c,d];}
function pip(x,y,poly){let ins=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))ins=!ins;}return ins;}
function dPL(lon,lat,pl){let best=1e9;const px=lon*.78,py=lat;for(let i=0;i<pl.length-1;i++){const ax=pl[i][0]*.78,ay=pl[i][1],bx=pl[i+1][0]*.78,by=pl[i+1][1];const dx=bx-ax,dy=by-ay;const t=clamp(((px-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy||1),0,1);const d=Math.hypot(px-ax-t*dx,py-ay-t*dy);if(d<best)best=d;}return best;}
function terrainAt(lon,lat,x,y){
 const n=vn(x*.13,y*.13,21), n2=vn(x*.35,y*.35,22);
 let mr=9;for(const r of RANGES){const d=dPL(lon,lat,r.pl)/r.w;if(d<mr)mr=d;}
 if(mr<.55+(n-.5)*.4)return n2<.2?WTT.HILLS:WTT.MOUNT;
 const nile=dPL(lon,lat,RIVERS[0]);
 const meso=Math.min(dPL(lon,lat,RIVERS[6]),dPL(lon,lat,RIVERS[7]));
 // deserts
 let desert=false;
 if(lon<12&&lat<31.8+(n-.5)*1.2)desert=true;
 if(lon>=12&&lon<33&&lat<32.2+(n-.5)*.6&&!(lon>20&&lon<23.5&&lat>31.9))desert=true;
 if(lon>=32&&lon<36&&lat<31.2)desert=true;
 if(lon>=35.8&&lon<50&&lat<34+(n-.5)*1.5&&!(lon<36.6&&lat>31.5))desert=true;

 if(d<2){n.wait=1+Math.random()*4;const z=n.zone;for(let k=0;k<12;k++){const tx=clamp(Math.floor(n.x/T+(Math.random()-.5)*14),z[0],z[2]),ty=clamp(Math.floor(n.y/T+(Math.random()-.5)*14),z[1],z[3]);const x=tx*T+8,y=ty*T+8;if(canStand(x,y,3)){n.tx=x;n.ty=y;break;}}return;}
 const sp=n.speed*dt;const mx=dx/d*sp,my=dy/d*sp;
 n.moving=true;n.anim+=dt*8;if(Math.abs(mx)>.01)n.face=mx>0?1:-1;
 if(!moveEnt(n,mx,my,3)){n.stuck=(n.stuck||0)+dt;if(n.stuck>.6){n.stuck=0;n.tx=n.x;n.ty=n.y;}}
}
function randLand(R,avoidSetts){for(let k=0;k<200;k++){const x=Math.floor(R()*WM.w),y=Math.floor(R()*WM.h);if(!WORLD.isLand(x,y))continue;if(avoidSetts&&WORLD.setts.some(s=>Math.hypot(s.x-x,s.y-y)<avoidSetts))continue;return [x+.5,y+.5];}return [WM.w/2,WM.h/2];}
function spawnWorldEnts(){
 const R=mulberry(G.seed+G.time.day*13);
 bandits=[];caravans=[];wships=[];
 for(let i=0;i<14;i++){const p=randLand(R,6);bandits.push({x:p[0]*WT,y:p[1]*WT,tx:p[0]*WT,ty:p[1]*WT,anim:R()*6,men:20+Math.floor(R()*50),cool:0});}
 const caps=WORLD.setts.filter(s=>s.kind==='capital'&&s.fac!==0);
 for(let i=0;i<14;i++){const a=pick(R,caps);caravans.push({x:a.x*WT,y:a.y*WT+6,tx:a.x*WT,ty:a.y*WT,fac:a.fac,anim:R()*6,cool:0,wait:R()*3});}
 for(let i=0;i<12;i++){for(let k=0;k<300;k++){const x=Math.floor(R()*WM.w),y=Math.floor(R()*WM.h);if(WORLD.t[y*WM.w+x]===WTT.SEA){let near=false;for(let d=1;d<6&&!near;d++)for(const [dx,dy] of [[d,0],[-d,0],[0,d],[0,-d]])if(WORLD.isLand(x+dx,y+dy))near=true;if(!near)continue;wships.push({x:(x+.5)*WT,y:(y+.5)*WT,tx:(x+.5)*WT,ty:(y+.5)*WT,face:1,fac:pick(R,WORLD.facs).id});break;}}}
}
function wanderWorld(e,dt,speed,ok,range,pickTarget){
 if(e.wait>0){e.wait-=dt;e.moving=false;return;}
 const dx=e.tx-e.x,dy=e.ty-e.y,d=Math.hypot(dx,dy);
 if(d<2){e.wait=1+Math.random()*3;pickTarget(e);return;}
 const s=speed*dt;e.moving=true;e.anim+=dt*6;if(Math.abs(dx)>.3)e.face=dx>0?1:-1;
 if(!wMove(e,dx/d*s,dy/d*s,ok)){e.stuck=(e.stuck||0)+dt;if(e.stuck>.8){e.stuck=0;pickTarget(e);}}
}
function updateWorldEnts(dt){
 for(const b of bandits){if(b.cool>0)b.cool-=dt;wanderWorld(b,dt,7,wLand,0,e=>{for(let k=0;k<10;k++){const x=e.x+(Math.random()-.5)*20*WT,y=e.y+(Math.random()-.5)*20*WT;if(wLand(x,y)){e.tx=x;e.ty=y;return;}}});}
 for(const c of caravans){if(c.cool>0)c.cool-=dt;wanderWorld(c,dt,8,wLand,0,e=>{const opts=WORLD.setts.filter(s=>s.fac!==0&&Math.hypot(s.x*WT-e.x,s.y*WT-e.y)<40*WT);const s=opts.length?pick(Math.random,opts):null;if(s){e.tx=s.x*WT;e.ty=s.y*WT+6;e.fac=s.fac;}});}
 for(const s of wships){wanderWorld(s,dt,10,wSea,0,e=>{for(let k=0;k<10;k++){const x=e.x+(Math.random()-.5)*24*WT,y=e.y+(Math.random()-.5)*24*WT;if(wSea(x,y)){e.tx=x;e.ty=y;return;}}});}
}

const TRAIL_MAX=260;
function trailSpacing(){return G.scene==='world'?1.3:3;}
function initTrail(bx,by,stack){
 player.trail=[];const sp=trailSpacing();
 for(let i=0;i<TRAIL_MAX;i++)player.trail.push(stack?{x:player.x,y:player.y}:{x:player.x+bx*sp*i,y:player.y+by*sp*i});
 guards.forEach((g,i)=>{const p=player.trail[(i+1)*5];g.x=p.x;g.y=p.y;});
}
function pushTrail(){const lt=player.trail[0];const sp=trailSpacing();if(!lt||Math.hypot(lt.x-player.x,lt.y-player.y)>sp){player.trail.unshift({x:player.x,y:player.y});if(player.trail.length>TRAIL_MAX)player.trail.length=TRAIL_MAX;}}
function columnMembers(){
 // returns array of {x,y,kind,unit,face,moving}
 const out=[];if(!G.field.active||G.scene==='camp')return out;
 const world=G.scene==='world', tr=player.trail;if(!tr.length)return out;
 const gap=world?2.2:5, rowsGap=world?2:4.5;
 let idx=world?16:22;
 for(const u of G.army){
  const n=clamp(Math.round(u.men/(world?30:14)),world?3:4,world?6:10);
  const cols=3, rows=Math.ceil(n/cols);
  for(let r=0;r<rows;r++){
   const p=tr[Math.min(idx+r*Math.round(rowsGap/(world?1.3:3)),tr.length-1)], q=tr[Math.min(idx+r*Math.round(rowsGap/(world?1.3:3))+3,tr.length-1)];
   let dx=p.x-q.x,dy=p.y-q.y;const d=Math.hypot(dx,dy)||1;dx/=d;dy/=d;
   const px=-dy,py=dx;
   for(let c=0;c<cols&&r*cols+c<n;c++){const o=(c-(cols-1)/2)*gap;out.push({x:p.x+px*o,y:p.y+py*o,u,kind:unitKind(u.name),face:dx>=0?1:-1});}
  }
  idx+=Math.round((rows*rowsGap+(world?4:9))/(world?1.3:3));
 }
 const nw=Math.max(1,Math.round(armyMen()/250));
 for(let i=0;i<nw;i++){const p=tr[Math.min(idx+i*(world?7:8),tr.length-1)],q=tr[Math.min(idx+i*(world?7:8)+3,tr.length-1)];out.push({x:p.x,y:p.y,wagon:true,face:p.x-q.x>=0?1:-1});}
 return out;
}

/* ---- transitions ---- */
const trans={phase:null,t:0,dur:0,from:1,to:1,fade0:0,fade1:0,fn:null,next:null,scale:1,fade:0};
function startTransition(zoomOut,fn){
 trans.phase='out';trans.t=0;trans.dur=.5;trans.from=1;trans.to=zoomOut?.35:2.8;trans.fade0=0;trans.fade1=.9;trans.fn=fn;
 trans.next={dur:.6,from:zoomOut?2.6:.4,to:1,fade0:.9,fade1:0};
 paused=true;hide('#prompt');
}
function updateTransition(dt){
 if(!trans.phase)return;
 trans.t+=dt;const k=clamp(trans.t/trans.dur,0,1),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
 trans.scale=trans.from+(trans.to-trans.from)*e;trans.fade=trans.fade0+(trans.fade1-trans.fade0)*e;
 if(k>=1){
  if(trans.phase==='out'){trans.fn&&trans.fn();trans.phase='in';trans.t=0;Object.assign(trans,trans.next);trans.scale=trans.from;}
  else{trans.phase=null;trans.scale=1;trans.fade=0;paused=false;}
 }
}

function econ(){
 const f=G.faction, season=seasonOf(G.time.day), pop=totalPop();
 const taxRate={low:.45,med:.7,high:1}[f.laws.tax];
 let tax=pop/100*taxRate;
 if(f.culture==='merchant')tax*=1.25;if(f.mtraits.includes('merchants'))tax*=1.1;if(f.gov==='merchant')tax*=1.15;if(f.culture==='warrior')tax*=.9;
 const market=f.laws.foreign==='welcome'?9:f.laws.foreign==='closed'?3:6;
 const harbor=W.hl.coastal?(f.culture==='seafaring'?10:6):0;
 const away=G.field.active&&G.scene!=='city';
 const upkeep=armyMen()/50*(f.laws.service==='volunteer'?1.3:f.laws.service==='forced'?.7:1)*(away?1.2:1);
 const temple=f.gov==='priest'?6:3;
 const sm=[0.8,1.15,1.5,W.hl.snow?0.3:0.7][season];
 let prod=155*sm;if(f.culture==='farmer')prod*=1.25;if(f.culture==='warrior')prod*=.9;if(f.domain==='harvest')prod*=1.08;if(f.laws.land==='people')prod*=1.08;if(f.laws.labor==='allowed')prod*=1.06;if(G.disaster&&G.disaster.drought)prod*=.6;
 const lp=landsPop(),cr={absorb:.75,subjects:.6,expel:.5}[f.laws.conquered]||.6;
 const landTax=lp/100*taxRate*cr;tax+=landTax;
 let landFood=0;for(const id of (G.conquests||[])){const st=WORLD&&WORLD.setts[id];if(st)landFood+=(st.kind==='capital'?32:16)*sm;}prod+=landFood;
 const cons=pop/40+(away?0:armyMen()/60);
 const trade=tradeGold();tax+=trade;
 const ce=cityEcon({trade,market,prod},sm);
 prod+=ce.food;
 return {cityGold:ce.gold,tax,trade,landTax,landFood,market,harbor,upkeep,temple,gold:tax+market+harbor-upkeep-temple+ce.gold,prod,cons,food:prod-cons,away};
}

let target=null;
function findTarget(){
 if(G.scene==='world')return findWorldTarget();
 const tx=player.x/T, ty=player.y/T;let best=null,bd=1e9;
 for(const b of L.buildings){
  const dx=Math.max(b.x-tx,0,tx-(b.x+b.w)), dy=Math.max(b.y-ty,0,ty-(b.y+b.h));const d=Math.hypot(dx,dy);
  const lim=b.type==='house'||b.type==='hut'||b.type==='tent'?0.9:b.type==='fire'?1.2:1.4;
  if(d<lim&&d<bd){bd=d;best={type:'b',b};}
 }
 for(const n of npcs){if(n.hidden||n.notalk)continue;const d=Math.hypot(n.x-player.x,n.y-player.y)/T;if(d<1.3&&d<bd+.3){bd=d;best={type:'n',n};}}
 if(!best){for(const v of L.villages){if(Math.hypot(v.x-tx,v.y-ty)<4){best={type:'v',v};break;}}}
 if(!best&&G.scene==='city'){const m=Math.min(tx,ty,MW-tx,MH-ty);if(m<4)best={type:'edge'};}
 if(!best&&G.scene==='camp'){const t=L.tiles[Math.floor(ty)*MW+Math.floor(tx)];const C=L.C;if(t===TL.GATE||tx<C.x0-1||tx>C.x1+1||ty<C.y0-1||ty>C.y1+1)best={type:'leaveCamp'};}
 return best;
}
function findWorldTarget(){
 const tx=player.x/WT,ty=player.y/WT;let best=null,bd=1e9;
 for(const s of WORLD.setts){if(s.razed)continue;const d=Math.hypot(s.x-tx,s.y-ty);const lim=s.kind==='capital'?1.6:1.1;if(d<lim&&d<bd){bd=d;best={type:'s',s};}}
 if(!best&&(isNight()||G.field.fatigue>60))best={type:'campHint'};
 return best;
}

let encounterCool=0;
function checkEncounters(dt){
 if(encounterCool>0){encounterCool-=dt;return;}
 const px=player.x,py=player.y;
 for(const b of bandits){if(b.cool>0)continue;if(Math.hypot(b.x-px,b.y-py)<1.8*WT){b.cool=20;encounterCool=3;return banditEncounter(b);}}
 for(const c of caravans){if(c.cool>0)continue;if(Math.hypot(c.x-px,c.y-py)<1.4*WT){c.cool=40;encounterCool=3;return caravanEncounter(c);}}
}

function utypeOf(n){

 if(kind==='village')return [['Militia',Math.round(55+R()*45)],['Slingers',Math.round(22+R()*24)]];

function fitZ(){return clamp(Math.min(innerWidth/(BW*.8),innerHeight/(BH*.85)),.55,3);}
function btile(x,y){const tx=Math.floor(x/BT),ty=Math.floor(y/BT);if(tx<0||ty<0||tx>=BCW||ty>=BCH)return BTT.ROCK;return B.type[ty*BCW+tx];}
function belev(x,y){const tx=clamp(Math.floor(x/BT),0,BCW-1),ty=clamp(Math.floor(y/BT),0,BCH-1);return B.elev[ty*BCW+tx];}
function bpass(x,y){if(x<-30||y<-40||x>BW+30||y>BH+40)return true;if(x<0||y<0||x>=BW||y>=BH)return true;const t=btile(x,y);return !(t===BTT.ROCK||t===BTT.WALL||t===BTT.BUILD||(t===BTT.GATE&&!(B.gate&&B.gate.broken)));}

function genBattleMap(o,R){
 const type=new Uint8Array(BCW*BCH),elev=new Uint8Array(BCW*BCH);
 B.type=type;B.elev=elev;B.hl=o.hl;
 const I=(x,y)=>y*BCW+x, inb=(x,y)=>x>=0&&y>=0&&x<BCW&&y<BCH;
 const blob=(cx,cy,r,fn)=>{for(let y=Math.floor(cy-r-2);y<=cy+r+2;y++)for(let x=Math.floor(cx-r-2);x<=cx+r+2;x++){if(!inb(x,y))continue;const d=Math.hypot(x-cx,y-cy)+(hash(x,y,77)-.5)*2.5;if(d<r)fn(x,y);}};
 const tt=o.terrain;
 const nHills=tt===WTT.HILLS?6:tt===WTT.MOUNT?8:tt===WTT.DESERT?4:3;
 for(let i=0;i<nHills;i++){const cx=4+R()*(BCW-8),cy=6+R()*(BCH-12),r=3+R()*6;blob(cx,cy,r,(x,y)=>{elev[I(x,y)]=Math.max(elev[I(x,y)],1);});if(R()<.5)blob(cx,cy,r*.5,(x,y)=>{elev[I(x,y)]=2;});}
 const nFor=tt===WTT.FOREST?9:tt===WTT.DESERT?0:tt===WTT.STEPPE?1:3;
 for(let i=0;i<nFor;i++){const cx=R()*BCW,cy=6+R()*(BCH-12),r=2+R()*5;blob(cx,cy,r,(x,y)=>{type[I(x,y)]=BTT.FOREST;});}
 if(tt===WTT.HILLS||tt===WTT.MOUNT)for(let i=0;i<7;i++){const cx=R()*BCW,cy=8+R()*(BCH-16);blob(cx,cy,1+R()*1.5,(x,y)=>{type[I(x,y)]=BTT.ROCK;});}
 if(tt===WTT.MARSH)for(let i=0;i<8;i++){blob(R()*BCW,8+R()*(BCH-16),2+R()*3,(x,y)=>{type[I(x,y)]=BTT.WATER;elev[I(x,y)]=0;});}
 if(tt===WTT.RIVER&&o.kind!=='siege'){const ry=Math.floor(BCH/2);for(let x=0;x<BCW;x++){const w=ry+Math.round(Math.sin(x*.2)*1.5);for(let d=-1;d<=1;d++)if(inb(x,w+d)){type[I(x,w+d)]=BTT.WATER;elev[I(x,w+d)]=0;}}}
 // clear deploy zones of rocks
 for(let y=0;y<BCH;y++)for(let x=0;x<BCW;x++){if((y>BCH*.6||y<BCH*.38)&&type[I(x,y)]===BTT.ROCK)type[I(x,y)]=BTT.OPEN;}
 B.lights=[];
 if(o.kind==='village'){
  for(let y=2;y<12;y++)for(let x=25;x<50;x++){type[I(x,y)]=BTT.OPEN;elev[I(x,y)]=0;}
  for(const [hx,hy] of [[27,3],[33,2],[40,4],[45,2],[30,8],[38,9],[44,8]]){for(let y=hy;y<hy+2;y++)for(let x=hx;x<hx+3;x++)type[I(x,y)]=BTT.BUILD;B.lights.push({x:(hx+1.5)*BT,y:(hy+2.5)*BT,r:50});}
 }
 if(o.kind==='siege'||o.kind==='defend'){
  const wy=17;B.wallY=wy*BT;
  for(let y=0;y<wy+3;y++)for(let x=0;x<BCW;x++){type[I(x,y)]=BTT.OPEN;elev[I(x,y)]=0;}
  for(let x=0;x<BCW;x++){type[I(x,wy)]=BTT.WALL;type[I(x,wy+1)]=BTT.WALL;elev[I(x,wy-1)]=2;elev[I(x,wy-2)]=1;}
  const gx=Math.floor(BCW/2)-1;for(let x=gx;x<gx+3;x++){type[I(x,wy)]=BTT.GATE;type[I(x,wy+1)]=BTT.GATE;}
  B.gate={x:(gx+1.5)*BT,y:(wy+1)*BT,hp:100,broken:false,tiles:[[gx,wy],[gx+1,wy],[gx+2,wy],[gx,wy+1],[gx+1,wy+1],[gx+2,wy+1]]};
  B.towers=[];for(let x=4;x<BCW-2;x+=12){if(Math.abs(x-gx)<4)continue;B.towers.push({x:(x+.5)*BT,y:(wy+.5)*BT,cd:R()*2});}
  B.towers.push({x:(gx-2)*BT,y:(wy+.5)*BT,cd:1},{x:(gx+5)*BT,y:(wy+.5)*BT,cd:2});
  // town
  for(let by=2;by<14;by+=4)for(let bx=2;bx<BCW-3;bx+=6){if(bx>gx-6&&bx<gx+6&&by>3)continue;if(R()<.85)for(let y=by;y<by+2;y++)for(let x=bx;x<bx+4;x++)type[I(x,y)]=BTT.BUILD;}
  for(let y=4;y<11;y++)for(let x=gx-4;x<gx+7;x++){type[I(x,y)]=BTT.PLAZA;}
  for(let y=11;y<wy;y++)for(let x=gx;x<gx+3;x++)type[I(x,y)]=BTT.ROAD;
  for(let y=wy+2;y<BCH;y++)for(let x=gx;x<gx+3;x++){if(type[I(x,y)]!==BTT.WATER)type[I(x,y)]=BTT.ROAD;elev[I(x,y)]=0;}
  for(let y=wy+2;y<wy+10;y++)for(let x=0;x<BCW;x++){if(type[I(x,y)]===BTT.FOREST||type[I(x,y)]===BTT.ROCK)type[I(x,y)]=BTT.OPEN;}
  B.plaza={x:(gx+1.5)*BT,y:7.5*BT};
  B.lights.push({x:B.gate.x,y:B.gate.y+20,r:70},{x:B.plaza.x,y:B.plaza.y,r:90});for(const t of B.towers)B.lights.push({x:t.x,y:t.y,r:50});
 }
 renderBattleMap();
}
function renderBattleMap(){
 const c=(B.canvas=B.canvas||document.createElement('canvas'));c.width=BW;c.height=BH;const x2=c.getContext('2d');
 const P=(x,y,w,h,col)=>{x2.fillStyle=col;x2.fillRect(x,y,w,h);};
 const season=seasonOf(G.time.day),hl=B.hl,snowy=season===3&&hl.snow;
 const grass=hl.grass[season];
 const mat=B.walled?{wall:'#b9ae9b',dark:'#8a7f6d'}:null;
 for(let ty=0;ty<BCH;ty++)for(let tx=0;tx<BCW;tx++){
  const t=B.type[ty*BCW+tx],e=B.elev[ty*BCW+tx],x=tx*BT,y=ty*BT,h1=hash(tx,ty,91);
  let g=shadeHex(grass,(.94+h1*.1)*(1+e*.07));
  P(x,y,BT,BT,g);
  if(e>0){const below=ty+1<BCH?B.elev[(ty+1)*BCW+tx]:e;if(below<e)P(x,y+BT-3,BT,3,shadeHex(grass,.8));const left=tx>0?B.elev[ty*BCW+tx-1]:e;if(left<e)P(x,y,2,BT,shadeHex(grass,1.15));}

  const f=fwd(u.ang),r=[-f[1],f[0]];const n=Math.ceil(u.men/u.mpf);

 case 'flank':{const cav=P.filter(u=>u.st.cav&&!u.isGen);if(!cav.length){toast('You have no cavalry to send');break;}if(!foes.length){cav.forEach(u=>issueOrder(u,{type:'move',x:u.x<BW/2?60:BW-60,y:BH*.4}));break;}const cx=foes.reduce((s,e)=>s+e.x,0)/foes.length,cy=foes.reduce((s,e)=>s+e.y,0)/foes.length;cav.forEach(u=>{const left=u.x<cx;const t=foes.slice().sort((a,b)=>(left?a.x-b.x:b.x-a.x))[0];issueOrder(u,{type:'move',x:clamp(t.x+(left?-80:80),30,BW-30),y:Math.max(30,t.y-90)});setTimeout(()=>{if(B&&alive(u)&&u.state!=='routing'&&alive(t))issueOrder(u,{type:'attack',tid:t.id});},6000/B.speed);});battleMsg('The cavalry swings wide around the flank!');break;}

}

 log(`${G.faction.capital} fell to ${tn(f.name)}. The reign of ${G.ruler.name} is over.`);
 inGame=false;paused=true;
 openModal(`${G.faction.capital} has fallen`,`<p>The army of <b>${esc(tn(f.name))}</b> has stormed your capital. Your banners are torn down from the walls.</p><p>The reign of <b>${esc(rulerTitle())} ${esc(G.ruler.name)}</b> ends here, after ${yearOf(G.time.day)} year${yearOf(G.time.day)>1?'s':''}.</p><p class="note">Family, heirs and carrying on your dynasty come in Build 6. For now, load a save to try again.</p>`,[{t:'Load a save',primary:true,fn:()=>{closeModal();quitToTitle();show('#loadScr');renderLoad();}},{t:'Main menu',fn:()=>{closeModal();quitToTitle();}}],true);
}

/* ---- movement (game minutes) ---- */
function worldSim(mins){
 if(!G||!G.ai||!WORLD)return;
 const steps=Math.max(1,Math.ceil(mins/60));const m=mins/steps;
 for(let k=0;k<steps;k++){
  for(const a of G.ai.armies){
   if(a.state==='siege'||a.state==='idle')continue;
   let tx,ty;
   if(a.state==='march'&&a.target!=null){const s=WORLD.setts[a.target];if(!s||s.fac===a.fac||s.razed||!atWar(a.fac,s.fac)){a.state='idle';a.target=null;continue;}tx=s.x*WT;ty=s.y*WT+4;}
   else if(a.state==='retreat'||a.state==='home'){const h=facCapital(a.fac);if(!h){a.state='idle';continue;}tx=h.x*WT;ty=h.y*WT+6;}
   else continue;
   const dx=tx-a.x,dy=ty-a.y,d=Math.hypot(dx,dy);
   const tt=WORLD.t[Math.floor(a.y/WT)*WM.w+Math.floor(a.x/WT)]||1;
   const sp=WT*17/1440*WTSPEED[tt]*m*(a.state==='retreat'?1.1:1);
   if(d<WT*.9){arrive(a);continue;}
   const st=Math.min(d,sp);let moved=false;
   for(const off of [0,.6,-.6,1.2,-1.2,1.8,-1.8]){const ang=Math.atan2(dy,dx)+off;const nx=a.x+Math.cos(ang)*st,ny=a.y+Math.sin(ang)*st;if(wLand(nx,ny)){a.x=nx;a.y=ny;moved=true;a.face=Math.cos(ang)>=0?1:-1;break;}}
   if(!moved){a.stuck++;if(a.stuck>40){a.stuck=0;a.state='idle';a.target=null;}}else a.stuck=Math.max(0,a.stuck-1);
  }
  // army vs army
  const A=G.ai.armies;
  for(let i=0;i<A.length;i++)for(let j=i+1;j<A.length;j++){const a=A[i],b=A[j];if(a.dead||b.dead||!atWar(a.fac,b.fac))continue;if(Math.abs(a.x-b.x)>WT*1.4||Math.abs(a.y-b.y)>WT*1.4)continue;armyClash(a,b);}
  G.ai.armies=G.ai.armies.filter(a=>!a.dead);
 }
}
function armyClash(a,b){
 const pa=unitsPower(a.units)*(.75+Math.random()*.5),pb=unitsPower(b.units)*(.75+Math.random()*.5);
 const [w,l]=pa>=pb?[a,b]:[b,a];const ratio=Math.min(pa,pb)/Math.max(pa,pb);
 w.units.forEach(u=>u[1]=Math.round(u[1]*(1-.15*ratio-.05)));l.units.forEach(u=>u[1]=Math.round(u[1]*(.45-.15*ratio)));
 w.units=w.units.filter(u=>u[1]>=5);l.units=l.units.filter(u=>u[1]>=5);
 const near=nearestSettName(w.x/WT,w.y/WT);
 news(`${Tn(WORLD.facs[w.fac].name)} defeated an army of ${tn(WORLD.facs[l.fac].name)} near ${near}.`);
 l.state='retreat';l.target=null;if(armyMenOf(l)<60){l.dead=true;G.ai.fac[l.fac].armyDead=G.time.day;}
}
function nearestSettName(x,y){let b=null,bd=1e9;for(const s of WORLD.setts){if(s.razed)continue;const d=Math.hypot(s.x-x,s.y-y);if(d<bd){bd=d;b=s;}}return b?b.name:'the wilds';}
function arrive(a){
 if(a.state==='retreat'||a.state==='home'){a.state='idle';return;}
 const s=WORLD.setts[a.target];if(!s){a.state='idle';return;}
 if(s.kind==='village'){
  if(s.fac===0&&playerNear(s,3)&&G.field.active){a.state='idle';return;}
  if(Math.random()<.55){setOwner(s,a.fac);a.units.forEach(u=>u[1]=Math.round(u[1]*.92));}else{a.units.forEach(u=>u[1]=Math.round(u[1]*.85));news(`The militia of ${s.name} drove off an attack by ${tn(WORLD.facs[a.fac].name)}.`);}
  a.state='home';a.target=null;a.rest=8;return;
 }
 a.state='siege';a.siege=0;
 if(s===WORLD.home){G.homeSiege={aid:a.id,days:0,assault:4+Math.floor(Math.random()*4)};news(`${Tn(WORLD.facs[a.fac].name)} laid siege to ${s.name}!`,true,true);homeSiegeAlert(a);}
 else if(s.fac===0)news(`${Tn(WORLD.facs[a.fac].name)} began besieging your city of ${s.name}!`,true,true);
}
function playerNear(s,r){if(G.scene==='world')return Math.hypot(player.x/WT-s.x,player.y/WT-s.y)<r;if(G.scene==='city')return s===WORLD.home;return false;}

/* ---- daily / seasonal ---- */
function aiDaily(){
 if(!G.ai)return;
 const ai=G.ai;
 for(const a of ai.armies){
  a.cool=Math.max(0,a.cool-1);
  if(a.rest>0){a.rest--;if(a.state==='idle')continue;}
  if(a.state==='idle'){
   const h=facCapital(a.fac);
   if(h&&Math.hypot(h.x*WT-a.x,h.y*WT-a.y)<WT*2){const tot=armyMenOf(a);if(tot<a.max){const f=Math.min(1.04,a.max/tot);a.units.forEach(u=>u[1]=Math.round(u[1]*f));}}
   const t=armyMenOf(a)>a.max*.55?pickArmyTarget(a):null;
   if(t){a.target=t.id;a.state='march';}else if(h&&Math.hypot(h.x*WT-a.x,h.y*WT-a.y)>WT*2)a.state='home';
  }
  if(a.state==='siege'){
   const s=WORLD.setts[a.target];if(!s||s.fac===a.fac||!atWar(a.fac,s.fac)){a.state='home';a.target=null;if(G.homeSiege&&G.homeSiege.aid===a.id)G.homeSiege=null;continue;}
   a.siege++;
   if(s===WORLD.home)continue;
   const gar=s.fac===0?200:260;
   if(a.siege>=4&&Math.random()<.025*a.siege*Math.min(2,armyMenOf(a)/gar)){a.units.forEach(u=>u[1]=Math.round(u[1]*.8));setOwner(s,a.fac);a.state='home';a.target=null;a.rest=12;}
   else if(a.siege>25){a.state='home';a.target=null;a.rest=6;news(`${Tn(WORLD.facs[a.fac].name)} gave up the siege of ${s.name}.`);}
  }
 }
 // home siege
 if(G.homeSiege){const H=G.homeSiege;const a=ai.armies.find(x=>x.id===H.aid);if(!a||a.state!=='siege'){G.homeSiege=null;}else{H.days++;if(H.days>=H.assault)homeAssault(a);}}
 // respawn armies
 for(const fid in ai.fac){const id=+fid;if(!facAlive(id)||(WORLD.facs[id]&&WORLD.facs[id].rebel))continue;if(!ai.armies.some(a=>a.fac===id)&&G.time.day-ai.fac[id].armyDead>14){const c=facCapital(id);if(c)spawnAIArmy(id,c,.7);}}
 ai.armies=ai.armies.filter(a=>facAlive(a.fac)||(a.rebel&&!a.dead));
 // relations drift & AI war on player
 const pcaps=WORLD.setts.filter(s=>s.fac===0&&!s.razed);
 for(const fid in G.rel){const r=G.rel[fid],id=+fid;if(!facAlive(id))continue;
  let base=0;if(r.trade)base+=15;if(r.status==='alliance')base+=35;if(r.status==='pact')base+=15;if(r.status==='war')base-=40;
  base-=(G.oath||0)*8;
  r.v+=(base-r.v)*.015;r.v=clamp(r.v,-100,100);
  if(r.status==='war'){r.since++;}
  if(r.status==='peace'&&r.v<-35){
   const cap=facCapital(id);if(!cap)continue;const near=pcaps.some(s=>Math.hypot(s.x-cap.x,s.y-cap.y)<35);
   const pw=PERS[ai.fac[id].pers].war;const strong=aiStrength(id)>playerStrength()*.8?1.6:.5;
   if(near&&Math.random()<pw*.03*strong*(r.v<-60?2:1))declareWarOnPlayer(id,'hate');
  }
  if(r.status==='war'&&r.since>12&&r.score>15&&Math.random()<.06*PERS[ai.fac[id].pers].peace)aiOffersPeace(id);
 }
}
function aiSeason(){
 if(!G.ai)return;const ai=G.ai;
 const caps=WORLD.setts.filter(s=>s.kind==='capital'&&s.fac>0&&!s.razed);
 // AI-AI peace
 ai.wars=ai.wars.filter(k=>{const [a,b]=k.split('-').map(Number);if(!facAlive(a)||!facAlive(b))return false;
  if(G.rel[a]&&G.rel[a].status==='alliance'&&atWar(0,b))return true;if(G.rel[b]&&G.rel[b].status==='alliance'&&atWar(0,a))return true;
  const p=(PERS[ai.fac[a].pers].peace+PERS[ai.fac[b].pers].peace)/2*.9;if(Math.random()<p){news(`${Tn(WORLD.facs[a].name)} and ${tn(WORLD.facs[b].name)} made peace.`);return false;}return true;});
 // AI-AI new wars
 for(const c of caps){const fid=c.fac;const pw=PERS[ai.fac[fid].pers].war;if(Math.random()>pw*.22)continue;if(G.ai.wars.filter(k=>k.split('-').map(Number).includes(fid)).length>=2)continue;
  const opts=caps.filter(o=>o.fac!==fid&&!atWar(fid,o.fac)&&Math.hypot(o.x-c.x,o.y-c.y)<26&&sameLand(c.x,c.y,o.x,o.y));if(!opts.length)continue;
  const t=opts.sort((p,q)=>aiStrength(p.fac)-aiStrength(q.fac))[0];
  if(aiStrength(t.fac)>aiStrength(fid)*1.4&&ai.fac[fid].pers!=='wild')continue;
  if(G.rel[t.fac]&&G.rel[t.fac].status==='alliance'&&G.rel[fid].status!=='alliance'&&Math.random()<.5)continue;
  ai.wars.push(warKey(fid,t.fac));news(`${Tn(WORLD.facs[fid].name)} declared war on ${tn(WORLD.facs[t.fac].name)}!`);
  if(G.rel[t.fac]&&G.rel[t.fac].status==='alliance')news(`Your allies ${tn(WORLD.facs[t.fac].name)} came under attack from ${tn(WORLD.facs[fid].name)}.`,false,true);
 }
 // tribute & coalition
 for(const fid in G.rel){const r=G.rel[fid];if(!facAlive(+fid))continue;if(r.tribute>0){G.res.gold+=r.tribute;news(`${Tn(WORLD.facs[fid].name)} paid ${r.tribute} gold in tribute.`,false,true);}else if(r.tribute<0){const p=Math.min(G.res.gold,-r.tribute);G.res.gold-=p;news(`You paid ${p} gold in tribute to ${tn(WORLD.facs[fid].name)}.`,false,true);}}
 if(capitalsHeld()>=3&&Math.random()<.45){
  const pcaps=WORLD.setts.filter(s=>s.fac===0&&s.kind==='capital');
  const members=caps.filter(c=>{const r=G.rel[c.fac];return r&&r.status!=='alliance'&&r.status!=='war'&&r.v<20&&pcaps.some(p=>Math.hypot(p.x-c.x,p.y-c.y)<40);}).map(c=>c.fac);
  const uniq=[...new Set(members)];
  if(uniq.length>=2){uniq.forEach(id=>{G.rel[id].status='war';G.rel[id].since=0;G.rel[id].score=0;G.rel[id].trade=false;G.rel[id].v=Math.min(G.rel[id].v,-30);});
   const names=uniq.slice(0,4).map(id=>WORLD.facs[id].name).join(', ');
   news(`A coalition has formed against you: ${names}${uniq.length>4?' and others':''}!`,true,true);
   setTimeout(()=>{if(inGame)openModal('A coalition rises',`<p>Your growing power frightens your neighbors. <b>${esc(names)}</b>${uniq.length>4?' and others':''} joined together and declared war on you.</p>`);},600);}
 }
}
function declareWarOnPlayer(id,why){
 const r=G.rel[id];r.status='war';r.since=0;r.score=0;r.trade=false;r.tribute=0;
 news(`${Tn(WORLD.facs[id].name)} declared war on you!`,true,true);
 joinAllies(id);hostagesOnWar(id);
 setTimeout(()=>{if(inGame&&$('#modal').classList.contains('hidden'))openModal('War!',`<p>A rider arrives, covered in dust. <b>${esc(Tn(WORLD.facs[id].name))}</b> declared war on ${esc(tn(G.faction.name))}.</p><p class="note">Their ruler, ${esc(WORLD.facs[id].ruler)}, is ${PERS[G.ai.fac[id].pers].name.toLowerCase()}. Expect their army on your lands.</p>`);},300);
}
function joinAllies(enemy){for(const fid in G.rel){const r=G.rel[fid];if(r.status==='alliance'&&+fid!==enemy&&facAlive(+fid)&&!atWar(+fid,enemy)){G.ai.wars.push(warKey(+fid,enemy));news(`Your allies ${tn(WORLD.facs[fid].name)} joined the war against ${tn(WORLD.facs[enemy].name)}.`,false,true);}}}
function declareWar(id,how){
 const r=G.rel[id];if(r.status==='war')return;
 const broken=r.status==='pact'||r.status==='alliance'||r.trade;
 r.status='war';r.since=0;r.score=0;r.trade=false;r.tribute=0;r.v=Math.min(r.v-30,-20);
 hostagesOnWar(id);
 if(broken){G.oath=(G.oath||0)+1;G.ruler.c.betray++;for(const k in G.rel)G.rel[k].v-=12;news(`${G.ruler.name} broke a treaty with ${tn(WORLD.facs[id].name)}. Every ruler now trusts you less.`,true,true);}
 else news(`${Tn(G.faction.name)} declared war on ${tn(WORLD.facs[id].name)}.`,false,true);
 joinAllies(id);
}
function aiOffersPeace(id){
 if(!inGame||!$('#modal').classList.contains('hidden'))return;
 const g=Math.round(40+G.rel[id].score*2);
 openModal('An envoy seeks peace',`<p>Envoys of <b>${esc(tn(WORLD.facs[id].name))}</b> arrive under a white branch. They offer peace and <b>${g} gold</b>.</p>`,[{t:'Accept peace',primary:true,fn:()=>{G.res.gold+=g;makePeace(id);closeModal();}},{t:'Refuse',fn:()=>{G.rel[id].v-=5;closeModal();}}],true);
}
function makePeace(id){hostagesOnPeace(id);const r=G.rel[id];r.status='peace';r.since=0;r.score=0;r.v=Math.max(r.v,-20);news(`${Tn(G.faction.name)} and ${tn(WORLD.facs[id].name)} made peace.`,true,true);
 for(const a of G.ai.armies){if(a.fac===id&&a.target!=null&&WORLD.setts[a.target]&&WORLD.setts[a.target].fac===0){a.state='home';a.target=null;}}
 if(G.homeSiege){const a=G.ai.armies.find(x=>x.id===G.homeSiege.aid);if(a&&a.fac===id)G.homeSiege=null;}}

/* ---- home siege ---- */
function homeSiegeAlert(a){
 const f=WORLD.facs[a.fac];const H=G.homeSiege;
 setTimeout(()=>{if(!inGame)return;openModal(`${G.faction.capital} is under siege!`,`<p>An army of <b>${esc(tn(f.name))}</b>, about <b>${armyMenOf(a)}</b> men, surrounds your capital.</p><p>Scouts think they will storm the walls in about <b>${H.assault} days</b>.</p><p class="note">${G.scene==='city'?'Ride out with your army to break the siege, or stay and defend the walls when they attack.':'March home to break the siege. If you are away when they attack, the city garrison fights alone.'}</p>`);},500);
}
function homeAssault(a){
 const f=WORLD.facs[a.fac];
 const here=G.scene==='city'||(G.scene==='world'&&Math.hypot(player.x/WT-WORLD.home.x,player.y/WT-WORLD.home.y)<4)||(G.scene==='camp'&&Math.hypot(G.camp.wx-WORLD.home.x,G.camp.wy-WORLD.home.y)<4);
 if(here){
  if(!inGame)return;
  openModal('They are storming the walls!',`<p>Horns sound across ${esc(G.faction.capital)}. <b>${esc(Tn(f.name))}</b> are coming over the walls with ${armyMenOf(a)} men.</p>`,[{t:'Defend the city',primary:true,fn:()=>{closeModal();startBattle({kind:'defend',fac:f,army:a,enemy:a.units.map(u=>[u[0],u[1]]),enemyGen:true,ret:G.scene});}}],true);
  return;
 }
 const garrison=(G.field.active?[['Militia',180],['Slingers',50]]:G.army.map(u=>[u.name,u.men]));
 const pd=unitsPower(garrison)*1.8*(1+.3*(wallsLevel()-1))*(.8+Math.random()*.4),pa=unitsPower(a.units)*(.8+Math.random()*.4);
 if(pd>=pa){a.units.forEach(u=>u[1]=Math.round(u[1]*.4));a.units=a.units.filter(u=>u[1]>=5);a.state='retreat';a.target=null;G.homeSiege=null;if(!G.field.active)G.army.forEach(u=>u.men=Math.max(5,Math.round(u.men*.8)));news(`The garrison of ${G.faction.capital} threw back ${tn(f.name)} assault!`,true,true);if(G.rel[a.fac])G.rel[a.fac].score+=20;}
 else{G.homeSiege=null;setOwner(WORLD.home,a.fac);}
}

/* ---- player vs AI armies ---- */
let armyEncCool=0;
function checkArmyEncounters(dt){
 if(armyEncCool>0){armyEncCool-=dt;return;}
 for(const a of G.ai.armies){if(a.cool>0)continue;if(Math.hypot(a.x-player.x,a.y-player.y)<1.5*WT){armyEncCool=4;a.cool=2;return armyEncounter(a);}}
}
function armyEncounter(a){
 const f=WORLD.facs[a.fac],r=G.rel[a.fac],men=armyMenOf(a);
 const kinds=a.units.map(u=>u[0]).filter((v,i,x)=>x.indexOf(v)===i).join(', ');
 const desc=`<div class="row"><div>${bannerHTML({c1:f.color,c2:f.c2,symbol:f.symbol},.5)}</div><div class="col"><p><b>Army of ${esc(tn(f.name))}</b></p><div class="sum"><b>Men</b><span>About ${men}</span><b>Units</b><span>${esc(kinds)}</span><b>Toward you</b><span>${r.status==='war'?'<span class="neg">At war</span>':relWord(r.v)}</span></div></div></div>`;
 const fight=()=>startBattle({kind:'field',fac:f,army:a,enemy:a.units.map(u=>[u[0],u[1]]),enemyGen:true});
 if(r.status==='war'){
  if(G.field.active)openModal('Enemy army!',desc+`<p style="margin-top:10px">Their scouts have seen you. Battle lines are forming.</p>`,[{t:'Fight',primary:true,fn:fight},{t:'Fall back',fn:()=>{closeModal();if(Math.random()<.65){toast('You pull back before they can close.');a.cool=3;}else{toast('They catch your rear guard. You must fight!');setTimeout(fight,500);}}},{t:'Send an envoy',fn:()=>{closeModal();envoyModal(a.fac);}}],true);
  else openModal('Enemy army!',desc+`<p style="margin-top:10px">You have only your bodyguards.</p>`,[{t:'Ride away',primary:true,fn:()=>{closeModal();if(Math.random()<.8){toast('You escape into the hills.');a.cool=3;}else{const g=Math.min(G.res.gold,80);G.res.gold-=g;G.ruler.wound={text:'Wounded escaping an enemy army',until:G.time.day+10};toast(`You escape, wounded. ${g} gold lost.`);a.cool=3;}}}],true);
 }else{
  openModal('A foreign army',desc+`<p style="margin-top:10px">They are not at war with you. Their captains watch your column closely as you pass.</p>`,[{t:'Let them pass',primary:true,fn:()=>{closeModal();a.cool=3;}},...(G.field.active?[{t:'Attack them (war)',fn:()=>{closeModal();declareWar(a.fac,'attack');setTimeout(fight,300);}}]:[]),{t:'Send an envoy',fn:()=>{closeModal();envoyModal(a.fac);}}],true);
 }
}

/* ---- diplomacy ---- */

 const f=WORLD.facs[id],r=G.rel[id],P=PERS[G.ai.fac[id].pers];

 const ps=playerStrength(),ts=aiStrength(id);

 const chance=(base)=>base+r.v*.6-(G.oath||0)*10+(ps>ts*1.5?10:ps<ts*.6?-10:0)+(Math.random()-.5)*20;
 const b=[];
 if(r.status==='war'){
  b.push({t:'Propose peace',primary:true,fn:()=>{if(chance(10+r.score+r.since*.8+(ps>ts?15:-10)+P.peace*30)>25){makePeace(id);say(`${esc(f.ruler)} accepts. The war is over.`);}else{say(`${esc(f.ruler)} refuses. "We will talk when your army is broken."`);}}});
  b.push({t:'Offer 200 gold for peace',disabled:G.res.gold<200,fn:()=>{if(chance(35+r.score+(ps>ts?10:-5)+P.peace*30)>15){G.res.gold-=200;makePeace(id);say(`They take the gold and agree to peace.`);}else say(`They laugh at your gold.`);}});
 }else{

  if(!r.trade)b.push({t:'Propose a trade deal',fn:()=>{if(chance(25+(G.ai.fac[id].pers==='greedy'?20:0)+(G.faction.culture==='merchant'?10:0))>20){r.trade=true;doneTask('treaty');news(`${Tn(G.faction.name)} signed a trade deal with ${tn(f.name)}.`,false,true);say(`They agree. Caravans will start moving between your lands (+${tradeIncome(id)} gold a day).`);}else say(`They have no interest in trading with you yet.`);}});
  else b.push({t:'Cancel the trade deal',fn:()=>{r.trade=false;r.v-=10;say('The trade deal is over. They are not pleased.');}});

function costMult(){return (G.ruler.earned&&G.ruler.earned.includes('builder')?.95:1)*(hasTech('concrete')?.75:1)*(G.faction.culture==='builder'?.85:1);}
function scaledCost(c){const m=costMult(),o={};for(const k in c)o[k]=Math.ceil(c[k]*(k==='gold'?m:1));return o;}
function canPay(c){if((c.gold||0)>G.res.gold)return false;for(const k of ['iron','horses','timber','silver'])if((c[k]||0)>(G.stock[k]||0))return false;if((c.food||0)>G.res.food)return false;return true;}
function pay(c){G.res.gold-=c.gold||0;G.res.food-=c.food||0;for(const k of ['iron','horses','timber','silver'])G.stock[k]-=c[k]||0;}
function costStr(c){const ic={gold:'🪙',timber:'🪵',iron:'⛓',silver:'⚪',horses:'🐎',food:'🌾'};return Object.entries(c).filter(([k,v])=>v>0).map(([k,v])=>`${ic[k]||k} ${v}`).join(' ');}

/* ---- construction ---- */
function startBuild(key,isWonder){
 const C=G.city;
 if(C.queue.length>=buildSlots()){toast('Your builders are all busy');return;}
 let cost,days,name;
 if(isWonder){const w=WONDERS[key];cost=scaledCost(w.cost);days=w.days;name=w.name;}
 else{const b=BLD[key],l=(C.bld[key]||0)+1;cost=scaledCost(b.cost(l));days=b.days(l);name=b.name+(b.max>1?' (level '+l+')':'');
  if(b.plot&&freePlot()<0){toast('No empty lots left in the city');return;}}
 if(!canPay(cost)){toast('You cannot afford that yet');return;}
 pay(cost);G.ruler.c.builds++;C.queue.push({key,wonder:!!isWonder,left:days,total:days,name});
 if(isWonder)C.wonders[key]='building';
 log(`Work began on the ${name} in ${G.faction.capital}.`);toast(`Builders start on the ${name}`);

}

 }}

/* ---- seasonal money ---- */
function loansSeason(){
 G.loans=G.loans.filter(l=>{if(G.res.gold>=l.per){G.res.gold-=l.per;l.left--;if(l.left<=0){toast('A loan is fully repaid');return false;}return true;}
  G.blocs.merchants-=15;G.res.blessing-=4;l.left++;news('You could not make a loan payment. The merchant families are furious.',true,true);return true;});
 G.inflation=Math.max(0,G.inflation-.03);
}

/* ---- econ hooks ---- */
function cityEcon(e,sm){
 let gold=(blv('market')-1)*6+(blv('harbor')>1?(blv('harbor')-1)*6:0)+(blv('mint')?8:0)+(hasWonder('lighthouse')?20:0);
 if(G.family&&G.family.spouse&&G.family.spouse.trait==='shrewd')gold+=4;if(customLaw('tithe'))gold-=4;if(customLaw('veterans'))gold-=3;if(customLaw('festivals'))gold-=5;
 if(G.city.crime>G.time.day)gold-=8;if(G.merchantStrike>G.time.day)gold-=e.market;
 if(G.blocs.merchants>75)gold+=e.trade*.25;if(customLaw('merchant'))gold+=e.trade*.2;if(G.blocs.nobles>75)gold+=5;
 let food=0;const fm=(1+(blv('granary')-1)*.06+(hasTech('crop')?.1:0));food+=e.prod*(fm-1);
 if(customLaw('bread'))food-=15;
 return {gold,food};
}
function cityMood(){let m=(blv('temple')-1)*3+(blv('baths')?5:0)+(hasWonder('gtemple')?10:0)+(hasWonder('colossus')?5:0)+(G.faction.material==='marble'&&blv('marble')?5:0)+(hasTech('philosophy')?2:0);
 if(customLaw('bread'))m+=5;if(customLaw('festivals'))m+=4;if(customLaw('nobles'))m-=4;if(customLaw('curfew'))m-=3;if(customLaw('conscript'))m-=3;
 if(G.city.riot)m-=8;if(G.ruler.earned&&G.ruler.earned.includes('ruthless'))m-=3;if(G.ruler.earned&&G.ruler.earned.includes('merciful'))m+=3;if(G.family&&G.family.spouse&&G.family.spouse.trait==='kind')m+=3;m-=G.inflation*50;if(G.blocs.priests<30)m-=4;return m;}
function wallsLevel(){return blv('walls')+(hasWonder('gwalls')?2:0);}

/* ---- recruiting ---- */
function recruitOptions(){
 const f=G.faction,base=MILS[f.mil].army.map(u=>u[0]);const set=new Set(base.concat(['Spearmen']));
 if(blv('range')){set.add('Slingers');set.add('Archers');set.add('Javelinmen');}
 if(blv('stables')){set.add('Light Cavalry');if(G.stock.horses>=0)set.add('Heavy Cavalry');if(f.mil==='horse'||f.culture==='horse'||(G.far&&G.far.unlock.steppe))set.add('Horse Archers');}
 if(blv('stables')&&(f.mtraits.includes('elephants')||(G.far&&G.far.unlock.eleph)))set.add('War Elephants');
 for(const id of (G.conquests||[])){const s=WORLD.setts[id];if(!s||s.kind!=='capital')continue;const fac=WORLD.facs[s.fac0];if(!fac)continue;({latin:['Hastati','Triarii'],greek:['Hoplites','Peltasts'],celtic:['Swordsmen'],eastern:['Archers','Cavalry']}[fac.naming]||[]).forEach(n=>set.add(n));if(['Carthage','Egypt','Persia','Bactria'].includes(fac.name))set.add('War Elephants');}
 if(!blv('stables')){for(const n of [...set])if(/Cavalry|Equites|Horse|Elephant/.test(n)&&!base.includes(n))set.delete(n);}
 return [...set].map(n=>{const tk=utypeOf(n),st=UT[tk];const size=tk==='eleph'?16:st.cav?50:st.missileUnit?70:tk==='pike'?120:100;
  let per=st.cav?4:(st.armor>.35?3:2);if(tk==='eleph')per=30;if(st.armor>.35&&(blv('forge')||hasTech('smelt')))per-=.5;if(customLaw('conscript'))per*=.8;
  const cost={gold:Math.round(per*size),iron:st.armor>.35?Math.round(size/10):0,horses:st.cav?Math.round(size/8):0};
  return {name:n,size,cost,tk};});
}
function maxUnits(){return 6+blv('barracks')*2;}
function recruit(o){
 if(G.army.length>=maxUnits()){toast('The barracks are full. Build up the Barracks or dismiss a unit.');return;}
 if(!canPay(o.cost)){toast('You cannot afford that');return;}
 if(G.res.cityPop<2000){toast('Not enough men left in the city');return;}
 pay(o.cost);G.res.cityPop-=o.size;
 const num=Math.max(0,...G.army.map(u=>u.num))+1;
 G.army.push({name:o.name,men:o.size,max:o.size,exp:0,num});
 log(`${G.ruler.name} raised a new unit: ${o.name} ${romanNum(num)}.`);toast(`${o.name} ${romanNum(num)} raised`);doneTask('recruit');
}

/* ================= FAMILY, COURT & INTRIGUE (Build 6) ================= */
const YEAR=DAYS_PER_SEASON*4;
const KTRAITS={brave:'Brave',clever:'Clever',kind:'Kind',cruel:'Cruel',pious:'Pious',ambitious:'Ambitious',lazy:'Lazy',sickly:'Sickly',charming:'Charming'};
const SPTRAITS={clever:{name:'Clever',desc:'+1 research a day'},charming:{name:'Charming',desc:'Envoys are better received'},pious:{name:'Pious',desc:'Priests approve'},kind:{name:'Kind',desc:'+3 mood'},ambitious:{name:'Ambitious',desc:'Pushes you forward... and plots'},shrewd:{name:'Shrewd',desc:'+4 gold a day'}};
const EDU={warrior:{name:'Warrior',stats:['Strength','Courage'],trait:'brave'},scholar:{name:'Scholar',stats:['Tactics','Charisma'],trait:'cautious'},statecraft:{name:'Statecraft',stats:['Leadership','Charisma'],trait:'just'},faith:{name:'Faith',stats:['Charisma','Courage'],trait:'pious'}};
const TUTORS={general:{name:'A retired general',cost:150,stat:'Tactics'},philosopher:{name:'A famous philosopher',cost:180,stat:'Charisma'},priest:{name:'A temple priest',cost:100,stat:'Courage'},diplomat:{name:'A court diplomat',cost:140,stat:'Leadership'}};
const ETRAITS={glorious:{name:'Glorious',desc:'Troops +5 morale'},ruthless:{name:'Ruthless',desc:'Feared: nobles approve, −3 mood'},merciful:{name:'Merciful',desc:'+3 mood'},builder:{name:'The Builder',desc:'Buildings 5% cheaper'},deceitful:{name:'Deceitful',desc:'Other rulers trust you less'},coward:{name:'Coward',desc:'Generals despise you'},conqueror:{name:'Conqueror',desc:'+5 reputation, generals approve'}};
const MISSIONS={scout:{name:'Scout their strength',days:1,chance:.85,cost:40},sabotage:{name:'Sabotage their army',days:1.5,chance:.6,cost:80},steal:{name:'Steal from their treasury',days:1.5,chance:.6,cost:60},assassinate:{name:'Assassinate their ruler',days:2,chance:.35,cost:150},unrest:{name:'Stir up their people',days:1.5,chance:.6,cost:70}};

function rulerAge(r){r=r||G.ruler;return r.age+Math.floor((G.time.day-(r.since||1))/YEAR);}
function kidAge(k){return Math.floor((G.time.day-k.born)/YEAR);}
function migrateFamily(){
 const R=mulberry(G.seed+91);
 if(!G.family)G.family={spouse:null,kids:[],siblings:[],nid:1};
 if(!G.ruler.since)G.ruler.since=1;if(!G.ruler.earned)G.ruler.earned=[];if(!G.ruler.c)G.ruler.c={wins:0,losses:0,retreats:0,sacks:0,mercy:0,builds:0,betray:0,conquests:0};
 if(!G.dynasty)G.dynasty=[];if(!G.house)G.house='House of '+G.ruler.name;
 if(!G.court){G.court={generals:[0,1].map(()=>({name:genName(G.faction.naming,R,false),loyalty:55+Math.floor(R()*25),ambition:20+Math.floor(R()*60),skill:3+Math.floor(R()*5)})),governors:{},spymaster:null,letters:[],envoys:[],spies:[],plotDay:0};}
 if(!G.rebels)G.rebels=[];if(!G.intel)G.intel={};
 G.reignStart=G.reignStart||G.ruler.since;
}
function ensureGovernors(){const R=Math.random;for(const id of (G.conquests||[])){const s=WORLD.setts[id];if(s&&!G.court.governors[id])G.court.governors[id]={name:genName(G.faction.naming,R,false),loyalty:50+Math.floor(R()*30),ambition:15+Math.floor(R()*70)};}for(const id in G.court.governors)if(!(G.conquests||[]).includes(+id))delete G.court.governors[id];}

/* ---- letters & notifications ---- */
function letter(from,text,popup){
 G.court.letters.unshift({day:G.time.day,from,text,read:false});if(G.court.letters.length>60)G.court.letters.length=60;
 if(popup!==false&&inGame&&$('#modal').classList.contains('hidden')&&$('#gmenu').classList.contains('hidden')&&G.scene!=='battle'){openModal('A courier arrives',`<p class="note">From ${esc(from)}</p><p>${text}</p>`);G.court.letters[0].read=true;}
 else toast('A courier brings a letter. Read it in Menu, then Politics.');
}
function travelDays(fid){const c=facCapital(fid);const d=c?Math.hypot(c.x-WORLD.home.x,c.y-WORLD.home.y):20;return Math.max(1,Math.round(d/9));}

/* ---- envoys by courier ---- */
function sendEnvoy(id,action,cost){
 if(cost&&G.res.gold<cost){toast('Not enough gold');return;}
 if(cost)G.res.gold-=cost;
 const days=travelDays(id);
 G.court.envoys.push({fid:id,action,arrive:G.time.day+days,cost});
 closeModal();toast(`Your envoy rides for ${WORLD.facs[id].name}. Expect an answer in about ${days} day${days>1?'s':''}.`);
 doneTask('envoy');
}
function envoyChance(id,base){const r=G.rel[id],ps=playerStrength(),ts=aiStrength(id);let c=base+r.v*.6-(G.oath||0)*10+(ps>ts*1.5?10:ps<ts*.6?-10:0)+(Math.random()-.5)*20;if(G.family.spouse&&G.family.spouse.trait==='charming')c+=8;if(G.ruler.traits.includes('charming'))c+=6;if(G.ruler.earned.includes('deceitful'))c-=10;c+=(G.ruler.stats.Charisma-5)*2;return c;}
function resolveEnvoy(e){
 const id=e.fid,f=WORLD.facs[id],r=G.rel[id];if(!f||!facAlive(id))return;const P=PERS[G.ai.fac[id].pers];const ps=playerStrength(),ts=aiStrength(id);
 const lost=Math.random()<(Object.values(G.rel).some(x=>x.status==='war')?.07:.03);
 if(lost){if(e.cost)G.res.gold+=0;letter('your scouts',`Your envoy to ${tn(f.name)} never arrived. The road is dangerous, and the message was lost${e.cost?' along with the gold':''}.`);return;}
 let t='';
 switch(e.action){
 case 'peace':if(r.status!=='war'){t='They are no longer at war with you.';break;}if(envoyChance(id,10+r.score+r.since*.8+(ps>ts?15:-10)+P.peace*30)>25){makePeace(id);t=`${esc(f.ruler)} accepts. The war is over.`;}else t=`${esc(f.ruler)} refuses. "We will talk when your army is broken."`;break;
 case 'buypeace':if(r.status!=='war'){G.res.gold+=200;t='They were already at peace. Your gold is returned.';break;}if(envoyChance(id,35+r.score+(ps>ts?10:-5)+P.peace*30)>15){makePeace(id);t='They take the gold and agree to peace.';}else{t='They keep the gold and laugh at your envoy.';}break;
 case 'gift':{const g=Math.round(14*P.gift);r.v=clamp(r.v+g,-100,100);t=`${esc(f.ruler)} accepts your gift. Relations improve (+${g}).`;break;}
 case 'trade':if(envoyChance(id,25+(G.ai.fac[id].pers==='greedy'?20:0)+(G.faction.culture==='merchant'?10:0))>20&&r.status!=='war'){r.trade=true;doneTask('treaty');news(`The ${G.faction.name} signed a trade deal with ${tn(f.name)}.`,false,true);t=`They agree. Caravans will start moving between your lands (+${tradeIncome(id)} gold a day).`;}else t='They have no interest in trading with you yet.';break;
 case 'pact':if(r.status==='peace'&&envoyChance(id,20)>25){r.status='pact';doneTask('treaty');news(`The ${G.faction.name} and ${tn(f.name)} swore not to attack each other.`,false,true);t='They swear by their gods not to attack you.';}else t='They will not tie their hands.';break;
 case 'alliance':if(r.status!=='war'&&envoyChance(id,r.status==='pact'?5:-10)>45){r.status='alliance';doneTask('treaty');news(`The ${G.faction.name} and ${tn(f.name)} became allies.`,true,true);t='They clasp hands with your envoy. You are allies now. They will join your wars.';}else t='They do not trust you enough for that.';break;
 case 'tribute':{const fear=ps/Math.max(1,ts);if(r.status!=='war'&&fear>1.8&&envoyChance(id,10)>-10){r.tribute=Math.round(20+fear*8);r.v-=20;news(`${Tn(f.name)} agreed to pay tribute to the ${G.faction.name}.`,false,true);t=`Afraid of your army, they agree to pay ${r.tribute} gold every season.`;}else{r.v-=25;t=`They refuse, insulted.`;if(G.ai.fac[id].pers==='aggressive'&&Math.random()<.4&&r.status==='peace'){t+=' Their ruler swears revenge.';setTimeout(()=>declareWarOnPlayer(id,'insult'),1500);}}break;}
 case 'canceltrade':r.trade=false;r.v-=10;t='The trade deal is over. They are not pleased.';break;
 }
 letter(`${f.ruler} of ${tn(f.name)}`,t);
}
function envoyModal(id){
 const f=WORLD.facs[id],r=G.rel[id];if(!f||!r)return;const P=PERS[G.ai.fac[id].pers];
 const ps=playerStrength(),ts=aiStrength(id);
 const stance=r.status==='war'?'At war':r.status==='alliance'?'Allied':r.status==='pact'?'Non-aggression pact':'At peace';
 const pending=G.court.envoys.find(e=>e.fid===id);
 const days=travelDays(id);
 const b=[];
 if(!pending){
  if(r.status==='war'){b.push({t:'Propose peace',primary:true,fn:()=>sendEnvoy(id,'peace')});b.push({t:'Offer 200 gold for peace',disabled:G.res.gold<200,fn:()=>sendEnvoy(id,'buypeace',200)});}
  else{
   b.push({t:'Send a gift (100 gold)',disabled:G.res.gold<100,fn:()=>sendEnvoy(id,'gift',100)});
   b.push(r.trade?{t:'Cancel the trade deal',fn:()=>sendEnvoy(id,'canceltrade')}:{t:'Propose a trade deal',fn:()=>sendEnvoy(id,'trade')});
   if(r.status==='peace')b.push({t:'Propose a non-aggression pact',fn:()=>sendEnvoy(id,'pact')});
   if(r.status!=='alliance')b.push({t:'Propose an alliance',fn:()=>sendEnvoy(id,'alliance')});
   b.push({t:'Demand tribute',fn:()=>sendEnvoy(id,'tribute')});
   const kids=G.family.kids.filter(k=>!k.hostage&&!k.dead);
   if(kids.length&&r.status!=='alliance')b.push({t:'Offer a child as hostage',fn:()=>hostageModal(id)});
  }
 }
 if(r.status!=='war')b.push({t:r.status==='pact'||r.status==='alliance'||r.trade?'Break treaty and declare war':'Declare war',fn:()=>{declareWar(id,'envoy');closeModal();}});
 if(G.court.spymaster)b.push({t:'Send spies',fn:()=>{closeModal();spyModal(id);}});
 const bad=G.oath?`<p class="neg" style="font-size:13px">You have broken ${G.oath} treaty${G.oath>1?'s':''}. Rulers remember.</p>`:'';
 const host=G.family.kids.filter(k=>k.hostage===id&&!k.dead).map(k=>`<p class="note">Your ${k.male?'son':'daughter'} ${esc(k.name)} lives at their court as a hostage${k.prisoner?' and is now held prisoner':''}.</p>`).join('');
 openModal('Envoy to '+tn(f.name),`<div class="row"><div>${bannerHTML({c1:f.color,c2:f.c2,symbol:f.symbol},.55)}</div><div class="col"><div class="sum"><b>Ruler</b><span>${esc(f.ruler)} · ${P.name}</span><b>Status</b><span>${stance}${r.trade?' · Trading':''}${r.tribute>0?' · Pays you '+r.tribute+'/season':''}</span><b>Feeling</b><span>${relWord(r.v)} (${Math.round(r.v)})</span><b>Their strength</b><span>${ts} vs your ${ps}</span><b>Envoy travel</b><span>About ${days} day${days>1?'s':''} each way</span></div></div></div>${pending?`<p class="note" style="margin-top:10px">An envoy is already on the road to them. Wait for their answer.</p>`:''}${host}${bad}`,b);
}
function hostageModal(id){
 const kids=G.family.kids.filter(k=>!k.hostage&&!k.dead);
 openModal('Send a hostage',`<p>Sending one of your children to live at the court of ${esc(tn(WORLD.facs[id].name))} proves you mean peace. They will treat the child as a guest... as long as there is peace.</p>`,kids.map(k=>({t:`${k.name} (${kidAge(k)})`,fn:()=>{k.hostage=id;const r=G.rel[id];r.v=clamp(r.v+30,-100,100);if(r.status==='peace')r.status='pact';closeModal();log(`${G.ruler.name} sent ${k.name} as a hostage to ${tn(WORLD.facs[id].name)}.`);toast(`${k.name} leaves for ${WORLD.facs[id].cap}. Relations improve.`);}})));
}
function hostagesOnWar(id){for(const k of G.family.kids){if(k.hostage===id&&!k.dead&&!k.prisoner){k.prisoner=true;letter(WORLD.facs[id].ruler,`Your ${k.male?'son':'daughter'} ${esc(k.name)} has been thrown in a cell in ${esc(WORLD.facs[id].cap)}. Make peace, or come and get them.`);}}}
function hostagesOnPeace(id){for(const k of G.family.kids){if(k.hostage===id&&k.prisoner){k.prisoner=false;k.hostage=null;letter(WORLD.facs[id].ruler,`As part of the peace, ${esc(k.name)} is sent home to you.`);}}}

/* ---- daily / seasonal ---- */
function familyDaily(){
 const C=G.court;
 C.envoys=C.envoys.filter(e=>{if(G.time.day>=e.arrive){resolveEnvoy(e);return false;}return true;});
 C.spies=C.spies.filter(s=>{if(G.time.day>=s.arrive){resolveSpy(s);return false;}return true;});
 // forged letters
 const ally=Object.keys(G.rel).find(k=>G.rel[k].status==='alliance'&&facAlive(+k));
 if(ally&&Math.random()<.012&&$('#modal').classList.contains('hidden')&&inGame&&G.scene!=='battle')forgedLetter(+ally);
 if(G.time.day%3===0)checkEarnedTraits();
}
function familySeason(){
 const fam=G.family,R=Math.random;
 // births
 if(fam.spouse&&rulerAge()<62&&rulerAge(fam.spouse)<43&&R()<.3){const male=R()<.5;const k={id:fam.nid++,name:genName(G.faction.naming,R,false).replace(/(ius|us|os|ix|on|o)$/,male?'$1':'a'),male,born:G.time.day,trait:pick(R,Object.keys(KTRAITS)),edu:null,tutor:null,hostage:null};fam.kids.push(k);log(`A ${male?'son':'daughter'}, ${k.name}, was born to ${rulerTitle()} ${G.ruler.name}.`);letter(fam.spouse.name,`Our ${male?'son':'daughter'} is born! We have named ${male?'him':'her'} <b>${esc(k.name)}</b>.`);doneTask('child');}
 // child illness
 for(const k of fam.kids){if(k.dead)continue;if(R()<(k.trait==='sickly'?.03:.005)&&kidAge(k)<12){k.dead=true;log(`${k.name}, child of ${G.ruler.name}, died of fever.`);letter('the palace physician',`I am sorry, my lord. ${esc(k.name)} did not survive the fever.`);}}
 // governors & generals
 ensureGovernors();
 for(const id in G.court.governors){const g=G.court.governors[id];g.loyalty+=(55-g.loyalty)*.1+(G.res.mood-55)*.05-(G.ruler.earned.includes('ruthless')?2:0)+(Math.random()-.5)*10;g.loyalty=clamp(g.loyalty,0,100);
  if(g.loyalty<22&&g.ambition>55&&Math.random()<.35){const s=WORLD.setts[id];if(s){governorRevolt(+id,g);break;}}}
 for(const gn of G.court.generals){gn.loyalty+=(G.blocs.generals-gn.loyalty)*.15+(Math.random()-.5)*8;gn.loyalty=clamp(gn.loyalty,0,100);}
 const bad=G.court.generals.find(g=>g.loyalty<22&&g.ambition>60);
 if(bad&&Math.random()<.4){coupAttempt(bad);return;}
 // plots & assassins
 const hater=Object.keys(G.rel).find(k=>G.rel[k].status==='war'&&G.rel[k].v<-60&&facAlive(+k));
 if(hater&&Math.random()<.3)assassinAttempt(+hater);
 else if(G.blocs.nobles<30&&Math.random()<.3)noblePlot();
 // aging & death
 const a=rulerAge();let p=a<45?.004:a<55?.02:a<65?.06:.15;if(G.ruler.wound&&G.ruler.wound.until>G.time.day)p+=.03;
 if(Math.random()<p)setTimeout(()=>rulerDies(a>=55?'old age':'a sudden illness'),1200);
 if(G.court.spymaster&&G.res.gold>=20)G.res.gold-=20;
}

/* ---- traits ---- */
function checkEarnedTraits(){
 const c=G.ruler.c,e=G.ruler.earned;const add=(k,cond)=>{if(cond&&!e.includes(k)){e.push(k);log(`People have started calling ${G.ruler.name} ${ETRAITS[k].name.toLowerCase().replace('the builder','a builder')}.`);toast(`New trait: ${ETRAITS[k].name}`);}};
 add('glorious',c.wins>=5);add('conqueror',c.conquests>=3);add('ruthless',c.sacks>=2);add('merciful',c.mercy>=3);add('builder',c.builds>=8);add('deceitful',c.betray>=2);add('coward',c.retreats>=3&&c.wins<c.retreats);
}

/* ---- intrigue events ---- */
function assassinAttempt(fid){
 const f=WORLD.facs[fid];
 if(G.court.spymaster&&Math.random()<.4+G.court.spymaster.skill*.05){letter(G.court.spymaster.name,`My people caught an assassin sent by ${esc(tn(f.name))} before he got near you. He is in chains.`);return;}
 if(!inGame||!$('#modal').classList.contains('hidden'))return;
 openModal('Assassin!',`<p>A man in a servant's tunic draws a knife and lunges at you${G.scene==='camp'?' in your tent':''}. He was sent by ${esc(tn(f.name))}.</p>`,[{t:'Fight him off',primary:true,fn:()=>{closeModal();const s=G.ruler.stats;const roll=Math.random()*10+s.Strength*.5+s.Courage*.5+(G.gear.armor?3*(G.gear.armor.tier+1):0);
  if(roll>9){toast('You disarm him. Your guards drag him away.');log(`${G.ruler.name} fought off an assassin sent by ${tn(f.name)}.`);G.rep+=2;}
