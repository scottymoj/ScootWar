function rebelFac(name,color,ruler){
 const id=WORLD.facs.length;
 WORLD.facs.push({id,name,cap:'',naming:G.faction.naming,color,c2:'#1a1a1a',symbol:'✠',culture:'Rebels',ruler,rebel:true});
 G.rebels.push({id,name,color,ruler});
 G.ai.fac[id]={pers:'aggressive',armyDead:-99};
 G.rel[id]={v:-80,status:'war',trade:false,tribute:0,since:0,score:0,rebel:true};

}
function startCivilWar(leader,share,setts){
 const id=rebelFac(`${leader}'s Rebels`,'#3a3a3a',leader);
 // defecting units
 const n=Math.max(1,Math.round(G.army.length*share));const def=[];
 for(let i=0;i<n&&G.army.length>1;i++){const k=Math.floor(Math.random()*G.army.length);def.push(G.army.splice(k,1)[0]);}
 const units=def.map(u=>[u.name,u.men]).concat([['Spearmen',80],['Slingers',40]]);
 // take conquered settlements
 const take=setts||(G.conquests||[]).filter(()=>Math.random()<.5).slice(0,3);
 for(const sid of take){const s=WORLD.setts[sid];if(s&&s.fac===0){G.conquests=G.conquests.filter(x=>x!==sid);delete G.landPop[sid];G.sowner=G.sowner||{};G.sowner[sid]=id;s.fac=id;}}
 worldDirty=true;
 const base=take.length?WORLD.setts[take[0]]:null;
 let x,y;if(base){x=base.x*WT;y=base.y*WT+6;}else{const h=WORLD.home;for(let k=0;k<40;k++){const a=Math.random()*Math.PI*2;x=(h.x+Math.cos(a)*7)*WT;y=(h.y+Math.sin(a)*7)*WT;if(wLand(x,y))break;}}
 const army={id:G.ai.nid++,fac:id,x,y,units,max:units.reduce((t,u)=>t+u[1],0),home:base?base.id:WORLD.home.id,state:'idle',target:null,siege:0,cool:0,stuck:0,face:1,rebel:true};
 G.ai.armies.push(army);
 G.civilWar={fid:id,leader,day:G.time.day};
 news(`Civil war! ${leader} has risen against ${G.ruler.name}${def.length?`, taking ${def.map(u=>u.name).join(', ')} with him`:''}.`,true,true);
 setTimeout(()=>{if(inGame)openModal('Civil war!',`<p><b>${esc(leader)}</b> has raised the banner of rebellion.${def.length?` These units went over to him: <b>${esc(def.map(u=>u.name+' '+romanNum(u.num)).join(', '))}</b>.`:''}${take.length?` He holds ${take.map(s=>esc(WORLD.setts[s].name)).join(', ')}.`:''}</p><p class="note">Destroy his army and take back his lands to end the war. If his men reach ${esc(G.faction.capital)}, they will besiege it.</p>`);},700);
}

function pickHeir(){
 const law=G.faction.succ,kids=G.family.kids.filter(k=>!k.dead&&!k.ruling&&!(k.hostage&&k.prisoner));
 if(!kids.length)return null;
 const byAge=kids.slice().sort((a,b)=>a.born-b.born);
 if(law==='eldest')return byAge.find(k=>k.male)||byAge[0];
 if(law==='chosen'){const ch=kids.find(k=>k.id===G.family.heir);return ch||byAge[0];}
 if(law==='strongest')return kids.slice().sort((a,b)=>(kidAge(b)>=16)-(kidAge(a)>=16)||(EDU[b.edu]?.name==='Warrior')-(EDU[a.edu]?.name==='Warrior'))[0];
 if(law==='elected'){const adults=kids.filter(k=>kidAge(k)>=16);if(!adults.length)return null;return adults.sort((a,b)=>(b.edu==='statecraft')-(a.edu==='statecraft'))[0];}

 return byAge[0];
}

  nr={name:nm,age:30+Math.floor(R()*15),since:G.time.day,stats:{Strength:5,Leadership:5,Tactics:5,Courage:5,Charisma:5},traits:[pick(R,Object.keys(RTRAITS)),pick(R,Object.keys(RTRAITS))].filter((v,i,a)=>a.indexOf(v)===i),hair:pick(R,HAIR),beard:true,earned:[],c:{wins:0,losses:0,retreats:0,sacks:0,mercy:0,builds:0,betray:0,conquests:0}};

let fogCv=null,fogCtx=null;
function migrate7(){
 if(!G.exp)G.exp='';
 if(!G.fleet)G.fleet={ships:HOMELANDS[G.faction.homeland].coastal?2:0,ax:null,ay:null};

function expBits(){if(!WORLD.exp){WORLD.exp=new Uint8Array(Math.ceil(WM.w*WM.h/8));if(G.exp){try{const b=atob(G.exp);for(let i=0;i<b.length&&i<WORLD.exp.length;i++)WORLD.exp[i]=b.charCodeAt(i);}catch(e){}}}return WORLD.exp;}
function isExp(tx,ty){if(tx<0||ty<0||tx>=WM.w||ty>=WM.h)return false;const i=ty*WM.w+tx;return (expBits()[i>>3]>>(i&7))&1;}
function saveExp(){const b=expBits();let s='';for(let i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);G.exp=btoa(s);}
function initFog(){
 fogCv=document.createElement('canvas');fogCv.width=WM.w;fogCv.height=WM.h;fogCtx=fogCv.getContext('2d');
 fogCtx.fillStyle='#1d160e';fogCtx.fillRect(0,0,WM.w,WM.h);
 const b=expBits();for(let y=0;y<WM.h;y++)for(let x=0;x<WM.w;x++){const i=y*WM.w+x;if((b[i>>3]>>(i&7))&1)fogCtx.clearRect(x,y,1,1);}
 const h=WORLD.home;reveal(h.x,h.y,15);for(const s of WORLD.setts)if(s.fac===0)reveal(s.x,s.y,6);
}
function reveal(cx,cy,r){
 const b=expBits();let any=false;
 for(let y=Math.floor(cy-r);y<=cy+r;y++)for(let x=Math.floor(cx-r);x<=cx+r;x++){if(x<0||y<0||x>=WM.w||y>=WM.h)continue;if(Math.hypot(x+.5-cx,y+.5-cy)>r)continue;const i=y*WM.w+x;if(!((b[i>>3]>>(i&7))&1)){b[i>>3]|=1<<(i&7);fogCtx&&fogCtx.clearRect(x,y,1,1);any=true;}}
 if(any)G.expDirty=true;
 return any;
}
function sightRadius(){return 7+(hasCompanion('scout')?4:0)+(G.atSea?2:0)+(G.field.active&&G.army.some(u=>/Cavalry|Scouts|Horse/.test(u.name))?1:0);}

const SACRED=[
 {key:'oracle',name:'The Oracle',lon:22.5,lat:38.5,desc:'A priestess speaks for the gods from a cave full of smoke.'},
 {key:'grove',name:'The Sacred Grove',lon:2.6,lat:47.6,desc:'Ancient oaks where druids gather. Warriors pray here before battle.'},
 {key:'sun',name:'Temple of the Sun',lon:31.4,lat:30.2,desc:'A temple older than any kingdom. Pilgrims come from every land.'},
 {key:'mountain',name:'The Holy Mountain',lon:22.35,lat:40.1,desc:'Clouds cover the peak where the gods are said to live.'},
 {key:'spring',name:'Spring of Healing',lon:29.1,lat:37.9,desc:'Warm white pools. People say the water heals any wound.'}
];
function genSites(){
 const R=mulberry(G.seed^0x5172);const list=[];
 for(const s of SACRED){const p=nearestLandTile(lonToX(s.lon),latToY(s.lat));list.push(Object.assign({},s,{kind:'sacred',x:p[0]+.5,y:p[1]+.5,id:'s_'+s.key}));}
 const kinds=[['ruins',13],['mine',9]];
 for(const [k,n] of kinds){for(let i=0;i<n;i++){for(let t=0;t<200;t++){const x=Math.floor(R()*WM.w),y=Math.floor(R()*WM.h);if(!WORLD.isLand(x,y))continue;if(WORLD.setts.some(s=>Math.hypot(s.x-x,s.y-y)<4))continue;if(list.some(s=>Math.hypot(s.x-x,s.y-y)<6))continue;
  const site={kind:k,x:x+.5,y:y+.5,id:k+'_'+i};
  if(k==='ruins')site.name=pick(R,['Fallen City','Old Tomb','Giants\' Ring','Buried Temple','Broken Fort','Forgotten Palace','Lost Shrine']);
  else{site.res=pick(R,['silver','iron','iron','gold']);site.name=({silver:'Silver Mine',iron:'Iron Mine',gold:'Gold Mine'})[site.res];}
  list.push(site);break;}}}
 WORLD.sites=list;
}
function nearestLandTile(x,y){x=Math.floor(x);y=Math.floor(y);if(WORLD.isLand(x,y))return [x,y];for(let r=1;r<8;r++)for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){if(WORLD.isLand(x+dx,y+dy))return [x+dx,y+dy];}return [x,y];}

 for(const s of WORLD.sites||[]){const wx=s.x*WT,wy=s.y*WT;if(!inView(wx,wy,30)||!isExp(Math.floor(s.x),Math.floor(s.y)))continue;const sx=(wx-camX)*Z,sy=(wy-camY)*Z,z=Z*.7;const st=siteState(s);
  const P=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(sx+x*z,sy+y*z,w*z,h*z);};

  else if(s.kind==='ruins'){P(-7,-1,14,3,'#8d877b');P(-6,-8,2,7,'#a8a194');P(1,-6,2,5,'#a8a194');P(4,-10,2,9,'#a8a194');if(st.done)P(-2,-3,3,2,'#5a4a3a');}
  else{P(-6,-6,12,7,'#6a5a4a');P(-3,-4,6,5,'#2a2018');P(-1,-9,2,3,s.res==='gold'?'#e0b15a':s.res==='silver'?'#dcdcdc':'#8a8a8a');if(st.owned)P(4,-12,4,3,G.faction.c1);}
  if(Math.hypot(wx-player.x,wy-player.y)<9*WT)label(s.name,sx,sy-14*z,s.kind==='sacred'?'#f3cf86':'#d8ccb0',true);
 }
}
function nearSite(){if(!WORLD.sites)return null;const tx=player.x/WT,ty=player.y/WT;for(const s of WORLD.sites)if(Math.hypot(s.x-tx,s.y-ty)<1.2)return s;return null;}
function visitSite(s){

 if(s.kind==='ruins'){

function sacredEffect(s){

 for(let i=0;i<4;i++){const th=Math.PI/2+.02,lane=-45+i*30;RC.cars.push({i,x:RCX+Math.cos(th)*(RA+lane)-i*0,y:RCY+Math.sin(th)*(RB+lane),ang:Math.PI,v:0,st:100,col:cols[i],name:i?rivals[i-1].name:G.ruler.name,skill:.82+Math.random()*.16,prog:0,lastTh:th,lane,done:false});}

 const b=bldOf(kind)||bldOf('market');const d=doorOf(b);return {x:d.x+(R()-.5)*b.w*T*.8,y:d.y+R()*T*1.5};

 const jobs=['market','market','smith','granary','temple','barracks','plaza','plaza','harbor'];
 for(const n of npcs){if(n.kind!=='citizen'||n.riot)continue;const near=houses.slice().sort((a,b)=>Math.hypot(doorOf(a).x-n.x,doorOf(a).y-n.y)-Math.hypot(doorOf(b).x-n.x,doorOf(b).y-n.y)).slice(0,6);const h=pick(R,near);if(!h)continue;n.home=nearStand(doorOf(h).x,doorOf(h).y,R);const j=pick(R,jobs.filter(j=>j==='plaza'||bldOf(j)));n.work=nearStand(...Object.values(workSpot(j,R)),R);n.sched=true;n.zone=[CITY.x0+2,CITY.y0+2,CITY.x1-2,CITY.y1-2];}

  npcs.push({kind:'regular',reg:k,name:G.regulars[k].name,x:w.x,y:w.y,tx:w.x,ty:w.y,wait:1,speed:14,anim:0,hair:k==='veteran'||k==='beggar'?'#9a9a9a':pick(R,HAIR),zone:[Math.floor(w.x/T-3),Math.floor(w.y/T-3),Math.floor(w.x/T+3),Math.floor(w.y/T+3)],work:w,home:h?nearStand(doorOf(h).x,doorOf(h).y,R):w,sched:true,regular:true,female:d.female});}

function schedGoal(n){
 const h=hourNow();
 if(n.regular){if(n.reg==='veteran'&&h>=18&&h<23)return 'tavern';if(h<6||h>=21)return 'home';return 'work';}
 if(h<6||h>=21)return 'home';if(h<11)return 'work';if(h<14)return n.lunch||(n.lunch=Math.random()<.5?'plaza':'work');if(h<18)return 'work';return Math.random()<.002?'tavern':(n.eve||(n.eve=Math.random()<.25?'tavern':'wander'));
}
function goalPos(n,g){
 if(g==='home')return n.home;if(g==='work')return n.work;
 if(g==='plaza')return n.plazaPos||(n.plazaPos={x:(80+Math.random()*10)*T,y:(58+Math.random()*9)*T});
 if(g==='tavern'){const tv=W.tavern;return tv?doorOf(tv):n.home;}
 return null;
}
function stepToward(n,gx,gy){
 const d=Math.hypot(gx-n.x,gy-n.y);
 if(d<7*T){n.tx=gx;n.ty=gy;return;}
 let best=null,bd=d;for(let k=0;k<14;k++){const a=Math.atan2(gy-n.y,gx-n.x)+(Math.random()-.5)*2.2;const r=(3+Math.random()*5)*T;const x=n.x+Math.cos(a)*r,y=n.y+Math.sin(a)*r;if(!canStand(x,y,3))continue;const dd=Math.hypot(gx-x,gy-y);if(dd<bd){bd=dd;best={x,y};}}
 if(best){n.tx=best.x;n.ty=best.y;}else{n.tx=n.x+(Math.random()-.5)*6*T;n.ty=n.y+(Math.random()-.5)*6*T;}
}
function schedUpdate(n,dt){
 const g=schedGoal(n);if(g!==n.goal){n.goal=g;n.wait=Math.random()*4;if(g!=='home')n.hidden=false;}
 const p=goalPos(n,g);
 if(!p)return false; // wander: default behaviour
 if(Math.hypot(n.x-player.x,n.y-player.y)>16*T&&Math.hypot(p.x-player.x,p.y-player.y)>16*T&&Math.hypot(p.x-n.x,p.y-n.y)>2*T){n.x=p.x;n.y=p.y;n.tx=p.x;n.ty=p.y;}
 const d=Math.hypot(p.x-n.x,p.y-n.y);
 if(d<1.5*T){
  if(g==='home'&&!n.regular){n.hidden=true;n.moving=false;return true;}
  if(g==='tavern'){n.hidden=true;n.moving=false;return true;}
  if(g==='home'&&n.regular){n.hidden=true;return true;}
  // at work: small wander around the spot
  if(n.wait>0){n.wait-=dt;n.moving=false;return true;}
  const tx=p.x+(Math.random()-.5)*3*T,ty=p.y+(Math.random()-.5)*2*T;if(canStand(tx,ty,3)){n.tx=tx;n.ty=ty;}n.wait=2+Math.random()*5;return false;
 }
 n.hidden=false;
 if(n.wait>0){n.wait-=dt;n.moving=false;return true;}
 const dt2=Math.hypot(n.tx-n.x,n.ty-n.y);if(dt2<2||n.stuck>.5||n.goalSet!==g){n.goalSet=g;stepToward(n,p.x,p.y);}
 const dx=n.tx-n.x,dy=n.ty-n.y,dd=Math.hypot(dx,dy)||1;const sp=n.speed*dt*1.7;
 n.moving=true;n.anim+=dt*8;if(Math.abs(dx)>.5)n.face=dx>0?1:-1;
 if(!moveEnt(n,dx/dd*sp,dy/dd*sp,3)){n.stuck=(n.stuck||0)+dt;if(n.stuck>.6){n.stuck=0;stepToward(n,p.x,p.y);}}
 return true;
}
function reactToPlayer(n){
 const now=performance.now()/1000;if(n.hidden||(n.reactT&&now<n.reactT))return;
 const d=Math.hypot(n.x-player.x,n.y-player.y)/T;if(d>3)return;
 n.reactT=now+25+Math.random()*20;
 if(G.cloak){if(Math.random()<.3)bubble(n,pick(Math.random,['Evening, friend.','Watch where you walk.','Nice cloak.']),2.5);return;}
 let op=n.regular?G.regulars[n.reg].op:(G.res.mood-50)*1.4+(n.seedOp||(n.seedOp=(Math.random()-.5)*40));
 if(op>40){bubble(n,pick(Math.random,['Hail, my lord!','Long live the '+rulerTitle().toLowerCase()+'!','Glory to '+G.faction.capital+'!']),3);n.cheerT=now+2;}
 else if(op>10){bubble(n,'*bows*',2.5);}
 else if(op<-25){bubble(n,pick(Math.random,['*spits*','Tyrant...','*turns away*']),3);}
}

function inStand(x,y,r){
 const ok=(px,py)=>{const tx=Math.floor(px/T),ty=Math.floor(py/T);if(tx<0||ty<0||tx>=IN.w||ty>=IN.h)return false;return !IN.solid[ty*IN.w+tx];};
 return ok(x-r,y-2)&&ok(x+r,y-2)&&ok(x-r,y+2)&&ok(x+r,y+2);
}
function updateInterior(dt){
 advanceTime(dt*16*SETTINGS.speed);
 const [ix,iy]=IN.court?[0,0]:readInput();const il=Math.hypot(ix,iy);const sp=55;
 if(il>.15){const nx=ix/Math.max(1,il),ny=iy/Math.max(1,il);
  let m=false;if(inStand(player.x+nx*sp*dt,player.y,3)){player.x+=nx*sp*dt;m=true;}if(inStand(player.x,player.y+ny*sp*dt,3)){player.y+=ny*sp*dt;m=true;}
  player.moving=m;player.anim+=dt*9;if(Math.abs(nx)>.1)player.face=nx>0?1:-1;}
 else player.moving=false;
 if(player.y>IN.door.y-2&&Math.abs(player.x-IN.door.x)<T*1.2){leaveInterior();return;}
 for(const n of IN.npcs){
  if(n.walkTo||n.leaving){const tx=n.leaving?n.tx:n.walkTo.x,ty=n.leaving?n.ty:n.walkTo.y;const dx=tx-n.x,dy=ty-n.y,d=Math.hypot(dx,dy);
   if(d>2){const s=Math.min(d,30*dt);n.x+=dx/d*s;n.y+=dy/d*s;n.moving=true;n.anim+=dt*9;n.face=dx>0?1:-1;}
   else{n.moving=false;if(n.leaving){IN.npcs.splice(IN.npcs.indexOf(n),1);break;}if(!n.arrived){n.arrived=true;n.walkTo=null;n.face=-1;setTimeout(()=>{if(IN&&IN.npcs.includes(n))petitionModal(n);},250);}}
   continue;}
  if(n.wander){if(n.wait>0){n.wait-=dt;n.moving=false;continue;}if(!n.tx2||Math.hypot(n.tx2-n.x,n.ty2-n.y)<2){const tx=n.x+(Math.random()-.5)*5*T,ty=n.y+(Math.random()-.5)*4*T;if(inStand(tx,ty,3)){n.tx2=tx;n.ty2=ty;}n.wait=Math.random()*2;continue;}
   const dx=n.tx2-n.x,dy=n.ty2-n.y,d=Math.hypot(dx,dy)||1;const s=(n.speed||18)*dt;const nx=n.x+dx/d*s,ny=n.y+dy/d*s;if(inStand(nx,ny,3)){n.x=nx;n.y=ny;n.moving=true;n.anim+=dt*10;n.face=dx>0?1:-1;}else n.tx2=null;}
  else if(n.spar||n.kneel||n.kind==='bard')n.anim+=dt*4;
 }
 target=interiorTarget();
}

function mixHex(a,b,t){const pa=parseInt(a.slice(1),16),pb=parseInt(b.slice(1),16);const r=Math.round(((pa>>16)&255)*(1-t)+((pb>>16)&255)*t),g=Math.round(((pa>>8)&255)*(1-t)+((pb>>8)&255)*t),bl=Math.round((pa&255)*(1-t)+(pb&255)*t);return '#'+((1<<24)|(r<<16)|(g<<8)|bl).toString(16).slice(1);}
function updateRulerLook(){
 const r=G.ruler;if(!r.hair0)r.hair0=r.hair;
 const g=clamp((rulerAge()-40)/26,0,1);r.hair=mixHex(r.hair0,'#d8d4cc',g);
 if(r.wound&&r.wound.until!==r.woundSeen){r.woundSeen=r.wound.until;if(Math.random()<.6&&(r.scars||0)<3){r.scars=(r.scars||0)+1;log(`${r.name} will carry a new scar from that day: ${r.wound.text.toLowerCase()}.`);}}
}

 document.querySelectorAll('[data-mon]').forEach(b=>b.onclick=()=>{const [type,vid]=b.dataset.mon.split(':');const v=G.victories.find(x=>x.id===+vid);const cost=type==='arch'?400:150;if(G.res.gold<cost)return;G.res.gold-=cost;

/* ---- decorations derived from game state ---- */
function decoAt(kind,x,y,extra){return Object.assign({kind:'deco',deco:kind,static:true,notalk:true,x:x*T,y:y*T,anim:Math.random()*6},extra||{});}
function buildDeco(){
 const out=[];const f=G.faction,L_=f.laws,R=mulberry(G.seed+21);
 // founder statue in the plaza
 const one=['kingdom','warlord','priest','mixed','tribal'].includes(f.gov);
 out.push(Object.assign(decoAt('founder',82.5,65),{notalk:false,kind:'monument',name:one?`Statue of ${(G.dynasty&&G.dynasty[0]?G.dynasty[0].name:G.ruler.name)}`:'Statue of the Founders',one}));
 for(const m of G.monuments){const sp=MON_SPOTS[m.type][m.spot];if(!sp)continue;out.push(Object.assign(decoAt(m.type,sp[0],sp[1]+(m.type==='arch'?0:0)),{notalk:false,kind:'monument',mon:m,name:(m.type==='arch'?'Arch':'Statue')+' of '+m.who}));
  if(m.state==='building')out.push(decoAt('worker',sp[0]+1.3,sp[1]+.6,{work:true}));}
 // construction scaffolding
 const C=G.city;let pi=0;const used=Object.keys(C.plots).map(Number);const free=[];for(let i=0;i<(W.plots||[]).length;i++)if(!used.includes(i))free.push(i);
 for(const q of C.queue){let area=null;
  if(q.wonder&&WONDER_PLOTS[q.key])area=WONDER_PLOTS[q.key];
  else if(BLD[q.key]&&BLD[q.key].plot){const p=W.plots[free[pi++]];if(p)area=[p.x,p.y,p.w,p.h];}
  else{const b=bldOf(q.key);if(b)area=[b.x,b.y,b.w,b.h];}
  if(!area)continue;out.push(Object.assign(decoAt('scaffold',area[0],area[1]+area[3]),{area,q,upgrade:!(q.wonder||BLD[q.key]&&BLD[q.key].plot)}));
  out.push(decoAt('worker',area[0]+area[2]*.3,area[1]+area[3]+.9,{work:true}));out.push(decoAt('worker',area[0]+area[2]*.7,area[1]+area[3]+.9,{work:true,face:-1}));}
 // siege damage
 if(C.damage){for(const id of C.damage.ids){const b=W.buildings[id];if(b)out.push(Object.assign(decoAt('ruin',b.x,b.y+b.h),{b,fixing:G.time.day>=C.damage.repairStart}));}}
 // culture
 const m=bldOf('market');
 if(L_.labor==='allowed'&&m){const x=m.x+m.w+2,y=m.y+3;out.push(decoAt('platform',x,y));out.push(Object.assign(decoAt('auctioneer',x+1.5,y-.6),{notalk:false,kind:'culture',name:'Auctioneer',line:'Strong backs! Captured in the wars! Who will bid?'}));for(let i=0;i<3;i++)out.push(Object.assign(decoAt('chained',x+.6+i*1.1,y+.4),{notalk:false,kind:'culture',name:'A captive',line:pick(R,['...','Please. I have children.','My city was free once.'])}));}
 if(L_.justice==='harsh')out.push(Object.assign(decoAt('pillory',91,57.5),{notalk:false,kind:'culture',name:'A man in the stocks',line:pick(R,['I only stole a loaf!','Do not throw anything, please...','Water... please.'])}));
 if(L_.foreign==='welcome'){for(let i=0;i<4;i++){const p=m?{x:(m.x+R()*m.w),y:(m.y+m.h+1+R()*2)}:{x:84+R()*4,y:60};out.push(Object.assign(decoAt('foreigner',p.x,p.y),{notalk:false,kind:'culture',static:true,name:pick(R,['A Phoenician trader','A merchant from Egypt','A Persian silk seller','A Greek wine dealer']),line:pick(R,['Best prices this side of the sea!','Your city is rich. I will come back.','Silk! Spices! Glass!']),tunic:pick(R,['#3a5a9a','#9a3a6a','#e0c060','#2a8a7a'])}));}}
 if(L_.foreign==='closed'){for(const g of W.gates)for(const s of [-1,1])out.push(Object.assign(decoAt('gateguard',g.x+(g.oy?s*3.4:-g.ox*3.6),g.y+(g.ox?s*3.4:-g.oy*3.6)),{notalk:false,kind:'culture',name:'Border guard',line:'No foreigners past this gate. Orders from the palace.'}));}
 // religion: street shrines and garlands on festival days
 const dom=f.domain;const shrineCol={war:'#a8322a',harvest:'#d9a640',sea:'#2f6f9a',sky:'#e8e2d0',under:'#2a2420'}[dom]||'#c9a23a';
 for(const [x,y] of [[70,62],[100,52],[96,64]])out.push(Object.assign(decoAt('shrine',x,y),{col:shrineCol,notalk:false,kind:'culture',name:`Shrine of ${f.god}`,line:pick(R,['Small offerings of bread and flowers cover the little altar.','Someone left a clay figure of a sick child here, asking for help.'])}));
 if(festivalToday())for(let i=0;i<6;i++)out.push(decoAt('garland',78+i*2.6,55.2,{col:shrineCol}));
 // arena crowd on games days
 if(G.gamesDay===G.time.day){const a=bldOf('arena');if(a)for(let i=0;i<14;i++){const p=nearStand((a.x+R()*a.w)*T,(a.y+a.h+1+R()*2)*T,R);out.push({kind:'citizen',cheer:true,static:true,x:p.x,y:p.y,anim:R()*6,moving:true,tunic:pick(R,TUNICS),hair:pick(R,HAIR),name:genName(f.naming,R,false),female:R()<.4,decoCrowd:true});}}
 // omen sights
 if(G.omenV&&G.omenV.type==='calf'){out.push(Object.assign(decoAt('calf',87,60),{notalk:false,kind:'culture',name:'A two-headed calf',line:'A farmer brought it from the fields. People stare and make signs against evil.'}));}

}

/* ---- festivals ---- */
const FESTS=[
 {name:'Festival of Sowing',desc:'Blessings for the seed and the plough.',eff:'More food this spring.'},
 {name:'Feast of the God',desc:'The god of the city is carried through the streets.',eff:'The people are happier.'},
 {name:'Harvest Festival',desc:'The first sheaves are offered at the altar.',eff:'A bigger harvest.'},
 {name:'Night of the Fires',desc:'Bonfires burn all night to call back the sun.',eff:'A good omen for the year.'}
];
function festivalToday(){return (G.time.day-1)%DAYS_PER_SEASON===4;}
function festNow(){return FESTS[seasonOf(G.time.day)];}
function festivalDaily(){
 if(G.festLed&&G.festLed!==G.time.day-1&&G.festLed!==G.time.day)G.festLed=null;
 const yday=G.time.day-1;
 if((yday-1)%DAYS_PER_SEASON===4&&G.festLed!==yday){G.res.blessing+=3;if(G.festInCity)G.blocs.priests-=3;log(`The priests led the ${FESTS[seasonOf(yday)].name} without the ${rulerTitle().toLowerCase()}.`);}
 G.festInCity=false;
 if(festivalToday()){const F=festNow();G.festInCity=G.scene==='city';if(inGame)setTimeout(()=>{if(!inGame||!$('#modal').classList.contains('hidden'))return;if(G.scene==='city')openModal(F.name,`<p>Today is the <b>${F.name}</b>. ${F.desc}</p><p class="note">The priests are waiting for you at the temple altar to lead the sacrifice. ${F.eff}</p>`);else toast(`Today is the ${F.name} in ${G.faction.capital}. The priests will lead it without you.`);},1500);if(G.scene==='city')refreshDeco();}
}
function festivalSacrifice(){
 const F=festNow();
 openModal(`Lead the ${F.name}`,`<p>Smoke curls up from the altar. The whole city has crowded into the temple and down the steps.</p><p>What will you offer to ${esc(G.faction.god)}?</p>`,[
  {t:'A white bull (80 gold)',primary:true,disabled:G.res.gold<80,fn:()=>doSacrifice(80,.35)},
  {t:'A ram (30 gold)',disabled:G.res.gold<30,fn:()=>doSacrifice(30,.2)},
  {t:'Bread and wine (5 gold)',disabled:G.res.gold<5,fn:()=>doSacrifice(5,.05)}],true);
}
function doSacrifice(cost,bonus){
 G.res.gold-=cost;G.festLed=G.time.day;G.blocs.priests+=4;closeModal();
 const good=Math.random()<.45+bonus+(G.faction.gov==='priest'?.1:0);const s=seasonOf(G.time.day);
 if(good){G.res.blessing+=10;G.rep+=2;if(s===0||s===2)G.res.food+=150;
  openModal('The gods are pleased',`<p>The priest reads the signs and lifts his hands. <i>"${esc(G.faction.god)} accepts the offering!"</i></p><p>The crowd roars. Music fills the streets until dawn.</p><p class="note">+10 mood${s===0||s===2?', +150 food':''}, +2 reputation.</p>`);log(`${G.ruler.name} led the ${festNow().name}. The omens were good.`);}
 else{G.res.blessing+=2;startOmen(pick(Math.random,['ravens','comet']));openModal('A dark sign',`<p>The priest goes pale. The signs in the offering are black and twisted.</p><p>The crowd falls silent. Soon people whisper of worse things to come.</p><p class="note">A bad omen hangs over the city. A cleansing sacrifice at the temple can lift it.</p>`);}
 doneTask('festival');

 if(d<1.6*T){if($('#modal').classList.contains('hidden')&&!paused){npcs.splice(npcs.indexOf(n),1);deliverMail();if(G.mail.length)setTimeout(spawnMessenger,3000);}return true;}
 const sp=n.speed*dt;n.moving=true;n.anim+=dt*12;n.face=dx>0?1:-1;
 if(!moveEnt(n,dx/d*sp,dy/d*sp,4)){n.stuck=(n.stuck||0)+dt;const a=Math.atan2(dy,dx)+(Math.random()<.5?1:-1)*1.2;moveEnt(n,Math.cos(a)*sp,Math.sin(a)*sp,4);if(n.stuck>3){n.x=player.x-dx/d*2*T;n.y=player.y-dy/d*2*T;}}

function compassDir(dx,dy){const a=Math.atan2(-dy,dx)*180/Math.PI;const dirs=['east','north-east','north','north-west','west','south-west','south','south-east'];return dirs[((Math.round(a/45)%8)+8)%8];}
function ridersUpdate(dt){
 for(const r of RIDERS.slice()){
  r.anim+=dt*12;r.t=(r.t||0)+dt;
  let tx,ty;
  if(r.kind==='courier'){tx=player.x;ty=player.y;}
  else if(r.phase==='out'){tx=r.target.x;ty=r.target.y;}else{tx=player.x;ty=player.y;}
  const dx=tx-r.x,dy=ty-r.y,d=Math.hypot(dx,dy);
  const sp=(r.kind==='scout'?34:30)*dt*SETTINGS.speed;
  if(r.kind==='courier'&&d<1.2*WT){if($('#modal').classList.contains('hidden')&&!paused){RIDERS.splice(RIDERS.indexOf(r),1);deliverMail();if(G.mail.length)setTimeout(spawnMessenger,2500);}continue;}
  if(r.kind==='scout'&&r.phase==='out'&&(d<2.2*WT||r.t>25||r.target.dead)){r.phase='back';r.saw={x:r.target.x,y:r.target.y,a:r.target};reveal(r.target.x/WT,r.target.y/WT,4);continue;}
  if(r.kind==='scout'&&r.phase==='back'&&d<1.2*WT){RIDERS.splice(RIDERS.indexOf(r),1);scoutReport(r);continue;}
  r.x+=dx/d*sp;r.y+=dy/d*sp;r.face=dx>0?1:-1;r.moving=true;
 }
}

/* ---- weather that changes the land ---- */
function weatherDaily(){
 if(G.weather==='rain')G.wet=Math.min(5,G.wet+1);else G.wet=Math.max(0,G.wet-1);
 const s=seasonOf(G.time.day);
 const mud=G.wet>=2;const flood=s===0&&G.wet>=3;
 if(mud&&!G.mudOn&&G.scene==='world'&&G.field.active)toast('Days of rain have turned the roads to mud. The army slows down.');
 if(flood&&!G.floodOn&&G.scene==='world')toast('The rivers have burst their banks. Crossings are dangerous.');
 G.mudOn=mud;G.floodOn=flood;
}
function winterPass(){return seasonOf(G.time.day)===3;}
function weatherBlocked(x,y){
 const tx=Math.floor(x/WT),ty=Math.floor(y/WT),cx=Math.floor(player.x/WT),cy=Math.floor(player.y/WT);
 if(tx===cx&&ty===cy)return false;
 const t=WORLD.t[ty*WM.w+tx],ct=WORLD.t[cy*WM.w+cx];
 if(t===WTT.MOUNT&&ct!==WTT.MOUNT&&winterPass()&&yToLat(ty+.5)>37){if(!G.passMsg||G.time.day!==G.passMsg){G.passMsg=G.time.day;toast('Deep snow has closed the mountain pass. Go around, or wait for spring.');}return true;}
 if(t===WTT.RIVER&&ct!==WTT.RIVER&&G.floodOn&&!WORLD.setts.some(s=>Math.hypot(s.x-tx,s.y-ty)<2.2)){if(!G.floodMsg||G.time.day!==G.floodMsg){G.floodMsg=G.time.day;toast('The river is in flood. Find a crossing near a town or bridge.');}return true;}
 return false;
}
function wLandW(x,y){return wLand(x,y)&&!weatherBlocked(x,y);}
function weatherSpeed(tt){let m=1;if(G.mudOn&&(tt===WTT.PLAIN||tt===WTT.STEPPE||tt===WTT.MARSH||tt===WTT.FOREST))m*=.72;if(winterPass()&&tt===WTT.HILLS)m*=.8;return m;}
function drawWorldWeather(inView,vw,vh){

function moveDet(d,tx,ty,tiles){const dx=tx-d.x,dy=ty-d.y,dd=Math.hypot(dx,dy);const step=Math.min(dd,tiles*WT);if(dd<1)return true;let nx=d.x+dx/dd*step,ny=d.y+dy/dd*step;if(!wLand(nx,ny)){for(let k=0;k<8;k++){const a=Math.atan2(dy,dx)+(k%2?1:-1)*(1+Math.floor(k/2))*.4;const x=d.x+Math.cos(a)*step,y=d.y+Math.sin(a)*step;if(wLand(x,y)){nx=x;ny=y;break;}}}d.face=dx>0?1:-1;d.x=nx;d.y=ny;return Math.hypot(tx-d.x,ty-d.y)<1.2*WT;}
function autoBattle(d,enemyUnits,defBonus){
 const pa=detPower(d),pd=unitsPower(enemyUnits)*(defBonus||1);const p=Math.pow(pa,1.4)/(Math.pow(pa,1.4)+Math.pow(pd,1.4));const win=Math.random()<p;
 const myLoss=win?.08+Math.random()*.14:.3+Math.random()*.2;
 d.units.forEach(u=>u.men=Math.max(0,Math.round(u.men*(1-myLoss))));d.units=d.units.filter(u=>u.men>=5);
 if(win)d.units.forEach(u=>u.exp=Math.min(5,(u.exp||0)+1));
 return win;
}

 if(prop.kind==='reform'){return ({professional:{nobles:-40,generals:30,people:15,merchants:-10},drill:{generals:20},cavalry:{nobles:10,generals:10},horse:{generals:10,nobles:-5}})[prop.k][fac]||0;}

function seatSVG(prop){
 const ms=G.senate.members;const seats=[];ms.forEach(m=>{const p=predicted(m,prop);for(let i=0;i<m.w;i++)seats.push(p);});
 const order={yes:0,unsure:1,no:2};seats.sort((a,b)=>order[a]-order[b]);
 const rows=5;let html='';let i=0;const per=[14,17,20,23,26];const n=seats.length;let idx=0;const pts=[];
 for(let r=0;r<rows;r++){const R=40+r*14;for(let k=0;k<per[r];k++){const a=Math.PI-(k+.5)/per[r]*Math.PI;pts.push({x:120+Math.cos(a)*R,y:118-Math.sin(a)*R,a});}}
 pts.sort((p,q)=>q.a-p.a);
 for(const p of pts){const v=seats[Math.floor(idx/pts.length*n)]||'unsure';idx++;html+=`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4.2" fill="${v==='yes'?'#7fb069':v==='no'?'#c9553b':'#8a8070'}"/>`;}

  return `<div class="slot" style="flex-wrap:wrap"><div class="i" style="min-width:200px"><b>${esc(m.name)}</b> · ${BLOCS[m.fac]} · ${m.w} votes<br><span class="note">${MTRAITS2[m.trait]} · likes you: ${m.op>30?'a lot':m.op>5?'somewhat':m.op>-20?'not much':'not at all'}</span></div><span style="font-weight:800;min-width:70px;color:${p==='yes'?'var(--green)':p==='no'?'var(--red)':'var(--muted,#a89a80)'}">${p==='yes'?'For':p==='no'?'Against':'Unsure'}</span>
  <div style="display:flex;gap:5px;flex-wrap:wrap"><button class="btn small" data-vl="${i}" ${m.lob||m.forced?'disabled':''}>Persuade</button><button class="btn small" data-vb="${i}" ${m.bri||m.forced||G.res.gold<cost?'disabled':''}>Bribe (${cost})</button><button class="btn small" data-vt="${i}" ${m.thr||m.forced?'disabled':''}>Threaten</button></div></div>`;}).join('');

 document.querySelectorAll('[data-vb]').forEach(b=>b.onclick=()=>{const m=G.senate.members[+b.dataset.vb];const cost=Math.round(m.w*(m.trait==='greedy'?8:12));if(G.res.gold<cost)return;m.bri=true;

function holdVote(){

  {t:'Accept the decision',primary:true,fn:closeModal},
  {t:'Do it anyway',fn:()=>{closeModal();G.senate.tyranny+=1;G.blocs.nobles-=15;G.senate.members.forEach(m=>m.op-=25);G.rep=Math.max(0,G.rep-5);G.res.blessing-=4;log(`${G.ruler.name} ignored the ${A.name} and acted alone.`);news(`${G.ruler.name} defied the ${A.name}! People whisper the word "tyrant".`,true,true);VOTE_BYPASS=true;try{prop.pass();}finally{VOTE_BYPASS=false;}checkTyranny();}}],true);

function snapLand(lon,lat){return nearestLandTile(lonToX(lon),latToY(lat));}
function genGeo(){
 const geo=[];
 for(const p of PASSES){const t=snapLand(p.lon,p.lat);geo.push(Object.assign({},p,{kind:'pass',x:t[0]+.5,y:t[1]+.5,id:'p_'+p.key}));}
 for(const s of STRAITS){[s.a,s.b].forEach((e,i)=>{const t=snapLand(e[0],e[1]);geo.push({kind:'strait',key:s.key,name:s.name,end:i,x:t[0]+.5,y:t[1]+.5,id:'st_'+s.key+i});});}
 for(const o of OASES){const t=snapLand(o.lon,o.lat);geo.push(Object.assign({},o,{kind:'oasis',x:t[0]+.5,y:t[1]+.5,id:'o_'+o.key}));}
 for(const f of FAR){const t=snapLand(f.lon,f.lat);geo.push(Object.assign({},f,{kind:'far',x:t[0]+.5,y:t[1]+.5,id:'f_'+f.key}));}
 WORLD.geo=geo;
 // edge map
 const em=new Uint8Array(WM.w*WM.h);const sums=EDGES.map(()=>[0,0,0]);
 for(let y=0;y<WM.h;y++)for(let x=0;x<WM.w;x++){const lon=xToLon(x+.5),lat=yToLat(y+.5);const sea=WORLD.t[y*WM.w+x]===WTT.SEA;
  for(let i=0;i<EDGES.length;i++){const E=EDGES[i];if(!!E.sea!==sea)continue;if(E.test(lon,lat)){em[y*WM.w+x]=i+1;break;}}}
 WORLD.edge=em;
 // river valleys
 const nearT=(x,y,r,tt)=>{for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){const nx=Math.floor(x)+dx,ny=Math.floor(y)+dy;if(nx<0||ny<0||nx>=WM.w||ny>=WM.h)continue;if(WORLD.t[ny*WM.w+nx]===tt)return true;}return false;};
 WORLD.nearT=nearT;
 for(const s of WORLD.setts){const lon=xToLon(s.x),lat=yToLat(s.y);s.valley=null;
  if(nearT(s.x,s.y,2,WTT.RIVER)){if(lon>29.3&&lon<34&&lat<31.9)s.valley='nile';else if(lon>38&&lon<48.8&&lat>29.5&&lat<37.6)s.valley='meso';else if(nearT(s.x,s.y,1,WTT.RIVER))s.valley='river';}}
}

function wpos(){if(!G)return null;if(G.scene==='world')return [player.x/WT,player.y/WT];if(G.scene==='camp'&&G.camp)return [G.camp.wx+.5,G.camp.wy+.5];return null;}

/* ---- expeditions ---- */
function gatePlace(k){return FAR.find(f=>f.key===k)||OASES.find(f=>f.key===k);}
function expReq(k){const e=EXPED[k],F_=G.far;
 if(!F_.seen[e.gate]){return `Reach ${gatePlace(e.gate).name} first`;}
 if(e.needs==='india'&&!F_.done.india_land&&!F_.done.india_sea)return 'Reach India first';
 if(e.needs==='camels'&&!F_.camels)return 'Buy camels first';
 if(e.ships&&(G.fleet.ships||0)<e.ships)return `Needs ${e.ships} warship${e.ships>1?'s':''}`;
 if(F_.exps.some(x=>x.k===k))return 'Already on the way';
 if(F_.exps.length>=2)return 'Two expeditions are already out';
 return '';}
function expChance(k,big){const e=EXPED[k];let r=e.risk-(big?.12:0)-(hasCompanion('scout')?.07:0)-(G.far.guides[e.gate]?.1:0)-(G.far.done[k]?.1:0);return clamp(1-r,.2,.92);}
function expModal(k){
 const e=EXPED[k];const lead=genName(G.faction.naming,Math.random,false);
 const c1=Math.round(expChance(k,false)*100),c2=Math.round(expChance(k,true)*100);
 openModal(e.name,`<p>Send an expedition to ${esc(e.dest)}. It will be led by <b>${esc(lead)}</b>, an experienced traveler.</p><div class="sum"><b>Journey</b><span>About ${Math.round(e.days/40*10)/10} years there and back</span><b>Leaves from</b><span>${esc(gatePlace(e.gate).name)}</span>${e.ships?`<b>Ships</b><span>${e.ships} of your warships go</span>`:''}<b>Guides</b><span>${G.far.guides[e.gate]?'Hired':'None (hire them at '+esc(gatePlace(e.gate).name)+')'}</span>${hasCompanion('scout')?'<b>Your scout</b><span>Planned the route</span>':''}</div><p class="note" style="margin-top:8px">Small party: ${c1}% chance to come back. Large party: ${c2}% chance. A failed expedition may come home empty handed, or vanish.</p>`,[
  {t:`Small party (${e.cost} gold)`,disabled:G.res.gold<e.cost,fn:()=>launchExp(k,false,lead)},
  {t:`Large party (${Math.round(e.cost*1.8)} gold)`,primary:true,disabled:G.res.gold<Math.round(e.cost*1.8),fn:()=>launchExp(k,true,lead)}]);
}
function launchExp(k,big,lead){
 const e=EXPED[k];const cost=big?Math.round(e.cost*1.8):e.cost;if(G.res.gold<cost)return;G.res.gold-=cost;
 if(e.ships)G.fleet.ships-=e.ships;
 G.far.exps.push({k,big,lead,start:G.time.day,due:G.time.day+e.days,mid:false,chance:expChance(k,big),ships:e.ships||0});
 if(G.far.guides[e.gate])G.far.guides[e.gate]=false;
 closeModal();log(`${G.ruler.name} sent ${lead} on an expedition to ${e.dest}.`);toast(`${lead} sets out for ${e.dest}.`);if(typeof renderMenu==='function'&&!$('#gmenu').classList.contains('hidden'))renderMenu();
}
function resolveExp(x){
 const e=EXPED[x.k],F_=G.far;F_.exps=F_.exps.filter(y=>y!==x);
 const r=Math.random();
 if(r<x.chance){const R_=e.reward;const gold=Math.round(R_.gold[0]+Math.random()*(R_.gold[1]-R_.gold[0]))*(x.big?1.2:1);G.res.gold+=Math.round(gold);
  let extra=[`${Math.round(gold)} gold in goods`];
  if(R_.unlock==='eleph'&&!F_.unlock.eleph){F_.unlock.eleph=true;extra.push('War Elephants can now be trained at your Stables');}
  if(R_.unlock==='steppe'&&!F_.unlock.steppe){F_.unlock.steppe=true;extra.push('Horse Archers can now be trained at your Stables');}
  if(R_.horses){G.stock.horses+=R_.horses;extra.push(R_.horses+' horses');}
  if(R_.route){F_.routes[R_.route[0]]=R_.route[1];extra.push(`a trade route worth ${R_.route[1]} gold a day`);}
  if(R_.blessing){G.res.blessing+=R_.blessing;extra.push('incense for the temples');}
  G.rep+=(R_.rep||8);if(R_.lore)addLore(R_.lore);if(x.ships)G.fleet.ships+=x.ships;
  F_.done[x.k]=(F_.done[x.k]||0)+1;
  log(`${x.lead} returned from ${e.dest}.`);
  letter(x.lead,`My lord, I have returned from ${esc(e.dest)}. ${esc(e.win)}<br><br><b>We bring:</b> ${extra.map(esc).join('; ')}.`);
 }else if(r<x.chance+(1-x.chance)*.45){const gold=Math.round(R_g(e)*.25);G.res.gold+=gold;if(x.ships)G.fleet.ships+=Math.max(0,x.ships-1);
  log(`The expedition to ${e.dest} came back broken.`);
  letter(x.lead,`My lord, I am sorry. We did not reach ${esc(e.dest)}. ${pick(Math.random,['Fever took half the men, and the guides ran off with the mules.','Raiders attacked us three times. We turned back with what we could carry.','The way was blocked by war between the kings beyond. We could not pass.'])} We bring only ${gold} gold in goods.${x.ships>1?' One ship was lost.':''}`);
 }else{
  log(`The expedition to ${e.dest} never returned.`);
  news(`No word has come from ${x.lead}'s expedition to ${e.dest}. They are presumed lost.`,true,true);
  if(Math.random()<.35)F_.surv.push({day:G.time.day+15+Math.floor(Math.random()*30),lead:x.lead,dest:e.dest,k:x.k});
 }
}
function R_g(e){return (e.reward.gold[0]+e.reward.gold[1])/2;}
function expDaily(){
 const F_=G.far;
 for(const x of F_.exps.slice()){const e=EXPED[x.k];
  if(!x.mid&&G.time.day>=x.start+Math.floor(e.days/2)){x.mid=true;letter(x.lead,pick(Math.random,[`My lord, we are halfway to ${esc(e.dest)}. The road is hard but the men are strong. The people here have never heard of ${esc(G.faction.capital)}.`,`A short letter, my lord, carried by a merchant going west. We are past the last town anyone at home has heard of. We will reach ${esc(e.dest)} if the gods allow.`,`My lord, two men died of fever this month, but we go on. The locals say ${esc(e.dest)} is not far now. They always say that.`]),false);}
  if(G.time.day>=x.due)resolveExp(x);}
 for(const s of F_.surv.slice()){if(G.time.day<s.day)continue;F_.surv=F_.surv.filter(y=>y!==s);const l=EXPED[s.k].reward.lore;if(l)addLore(l);G.rep+=3;
  letter('A ragged stranger',`My lord, do you remember me? I am the last of ${esc(s.lead)}'s expedition to ${esc(s.dest)}. All the others are dead. It took me a year to walk home. I have seen things no one will believe.${l?'<br><br><i>'+esc(l.text)+'</i>':''}`);log(`A lone survivor of the expedition to ${s.dest} came home.`);}
}

 case 'politics':return politicsTabHTML();
 case 'innovations':return innovationsHTML();
 case 'chronicle':return `<h3>Chronicle of ${esc(tn(f.name))}</h3><div class="chron">${G.chronicle.slice().reverse().map(c=>`<div><b>${dateStr(c.day)}</b><br>${esc(c.text)}</div>`).join('')}</div>`;
 case 'journal':return `<h3>Journal</h3><h4>Advisor's tasks</h4>${TASKS.map(t=>`<div style="padding:6px 0;font-size:14px">${G.tasks[t.id]?'✅':'⬜'} ${esc(taskText(t))}</div>`).join('')}`;
 case 'settings':return `<h3>Save</h3><div class="slots">${SLOTS.map(s=>{const l=slotLabel(readSlot(s));return `<div class="slot"><div class="i"><b>${s==='auto'?'Auto-save':'Slot '+s}</b>${l?esc(l.sub):'<span class="note">Empty</span>'}</div>${s!=='auto'?`<button class="btn small primary" data-save="${s}">Save here</button>`:''}</div>`;}).join('')}</div><p class="note">The game auto-saves at the start of every season.</p><h4>Move a save between devices</h4><div class="row"><button class="btn small" id="bExport">Export save</button><button class="btn small" id="bImport">Import save</button></div><div id="ioBox"></div><h4>Settings</h4>${settingsHTML()}<h4>Leave</h4><button class="btn small" id="bQuit">Save and quit to main menu</button>`;
 }

 <div class="lawrow"><div class="n">Minimap</div><div class="seg" id="setMini"><div class="opt${SETTINGS.minimap?' sel':''}" data-k="1"><b>On</b></div><div class="opt${!SETTINGS.minimap?' sel':''}" data-k="0"><b>Off</b></div></div></div>

 const b=(id,fn)=>document.querySelectorAll(id+' .opt').forEach(el=>el.onclick=()=>{fn(el.dataset.k);saveSettings();rerender();});
 b('#setSpeed',k=>SETTINGS.speed=+k);b('#setZoom',k=>{SETTINGS.zoom=+k;resize();});
 b('#setAdv',k=>{SETTINGS.advisor=k==='1';if(G)updateAdvisor();});

function bindTab(t){
 if(t==='character')drawPortrait($('#mPort'),G.faction,G.ruler);
 if(t==='empire')bindEmpire();if(t==='senate')bindSenate();if(t==='far')bindFar();if(t==='legends')bindLegends();if(t==='war')bindWar();if(t==='trade')bindTrade();
 if(t==='travel'){bindCompanions();if($('#bColony'))$('#bColony').onclick=()=>{closeMenu();colonyModal();};}
 if(t==='family')bindFamily();if(t==='politics')bindPolitics();
 if(t==='cities')bindCityTab();if(t==='economy')bindEconomy();if(t==='faction')bindFactionTab();if(t==='innovations')bindInnovations();if(t==='army')bindArmyManage();

 if(t==='world'){if(!WORLD.canvas||worldDirty)applyConquests();const cv=$('#wmap');cv.width=WM.w*2;cv.height=WM.h*2;const c=cv.getContext('2d');c.imageSmoothingEnabled=true;c.drawImage(WORLD.canvas,0,0,cv.width,cv.height);if(fogCv){c.globalAlpha=.92;c.drawImage(fogCv,0,0,cv.width,cv.height);c.globalAlpha=1;}
  c.font='bold 9px Inter,sans-serif';c.textAlign='center';
  for(const s of WORLD.setts){if(s.kind!=='capital'||!isExp(Math.floor(s.x),Math.floor(s.y)))continue;const x=s.x*2,y=s.y*2;c.fillStyle='#000a';c.fillText(s.name,x+1,y-5);c.fillStyle=s.fac===0?'#fff':'#f1e8d6';c.fillText(s.name,x,y-6);}
  const px=G.scene==='world'?player.x/WT*2:(G.camp?(G.camp.wx+.5)*2:WORLD.home.x*2),py=G.scene==='world'?player.y/WT*2:(G.camp?(G.camp.wy+.5)*2:WORLD.home.y*2);
  c.strokeStyle='#fff';c.lineWidth=2;c.beginPath();c.arc(px,py,6,0,7);c.stroke();}
 if(t==='settings'){
  document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{saveTo(b.dataset.save);renderMenu();});
  bindSettings(renderMenu);

  $('#bExport').onclick=()=>{syncPlayer();const code=btoa(unescape(encodeURIComponent(JSON.stringify(packSave()))));$('#ioBox').innerHTML=`<p class="note">Copy this code and paste it into Import on your other device.</p><textarea id="ioT" readonly style="min-height:90px">${code}</textarea><button class="btn small" id="ioCopy" style="margin-top:6px">Copy code</button>`;$('#ioCopy').onclick=()=>{navigator.clipboard.writeText(code).then(()=>toast('Copied'),()=>{$('#ioT').select();toast('Select the text and copy it');});};};
  $('#bImport').onclick=()=>importBox($('#ioBox'),true);
 }
}
function importBox(el,inGameNow){
 el.innerHTML=`<p class="note">Paste a save code here.</p><textarea id="ioT" style="min-height:90px"></textarea><button class="btn small primary" id="ioGo" style="margin-top:6px">Load this save</button>`;
 $('#ioGo').onclick=()=>{try{const d=JSON.parse(decodeURIComponent(escape(atob($('#ioT').value.trim()))));if(!d.G||!d.G.faction)throw 0;writeSlot('auto',Object.assign(d,{saved:Date.now()}));if(inGameNow){hide('#gmenu');}loadData(d);toast('Save imported');}catch(e){toast('That code did not work');}};

function loadData(d){

function refreshTitle(){$('#bContinue').disabled=!latestSave();}
$('#bContinue').onclick=()=>{const d=latestSave();if(d)loadData(d);};
$('#bNew').onclick=startCreator;
$('#bLoad').onclick=()=>{show('#loadScr');renderLoad();};
$('#lClose').onclick=()=>hide('#loadScr');
function renderLoad(){
 const B=$('#lBody');
 B.innerHTML=`<div class="slots">${SLOTS.map(s=>{const l=slotLabel(readSlot(s));return `<div class="slot"><div class="i"><b>${s==='auto'?'Auto-save':'Slot '+s}${l?' · '+esc(l.name):''}</b>${l?esc(l.sub):'<span class="note">Empty</span>'}</div>${l?`<button class="btn small primary" data-load="${s}">Load</button><button class="btn small" data-del="${s}">Delete</button>`:''}</div>`;}).join('')}</div><h4 style="color:var(--gold);font-size:13px;margin:16px 0 6px">IMPORT A SAVE CODE</h4><div id="ioBox2"></div>`;

const cv=$('#game'), ctx=cv.getContext('2d');
let Z=3, dpr=1, VW=0, VH=0;
const lightCv=document.createElement('canvas'), lctx=lightCv.getContext('2d');
function resize(){
 dpr=Math.min(window.devicePixelRatio||1,3);
 VW=cv.width=Math.floor(innerWidth*dpr);VH=cv.height=Math.floor(innerHeight*dpr);
 lightCv.width=VW;lightCv.height=VH;
 Z=Math.max(2,Math.round(Math.min(VW,VH)/300)+SETTINGS.zoom);
 ctx.imageSmoothingEnabled=false;
}
addEventListener('resize',resize);resize();
let camX=0,camY=0;
function drawPerson(n,sx,sy,o){
 const z=Z*(o.sc||1);const P=(ax,ay,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(Math.round(sx+ax*z),Math.round(sy+ay*z),Math.ceil(w*z),Math.ceil(h*z));};
 const step=n.moving?Math.round(Math.sin(n.anim)*1.4):0;
 ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(sx,sy,(o.horse?6:4)*z,1.6*z,0,0,7);ctx.fill();
 if(o.horse){
  const f=n.face||1, hb=o.horseCol||'#6b4426', hd='#4a2e18';
  const lg=n.moving?Math.round(Math.sin(n.anim*1.3)*1.5):0;
  P(-5,-3,2,3+lg,hd);P(-2,-3,2,3-lg,hd);P(2,-3,2,3+lg,hd);P(5,-3,2,3-lg,hd);
  P(-6,-8,13,5,hb);P(f>0?6:-9,-11,4,5,hb);P(f>0?8:-9,-11,2,2,hd);P(f>0?-8:7,-8,2,4,hd);
  P(-3,-9,6,2,o.tunic2||'#8a2a2a');
  sy-=7*z;
 }
 if(o.cape)P(-3,-9,6,7,o.cape);
 if(!o.horse){P(-2,-3,2,4+(step>0?0:-1),'#3a2a1a');P(1,-3,2,4+(step<0?0:-1),'#3a2a1a');}
 P(-3,-8,6,5,o.tunic);
 if(o.trim)P(-3,-4,6,1,o.trim);
 P(-4,-7,1,3,'#d9a77a');P(3,-7,1,3,'#d9a77a');
 P(-2,-12,4,4,'#e0b088');
 if(o.female){P(-2,-12,4,1,o.hair);P(-3,-12,1,4,o.hair);P(2,-12,1,4,o.hair);}else P(-2,-12,4,1,o.hair);
 if(o.beard)P(-2,-9,4,1,o.hair);
 if(o.scars){P(1,-11,1,3,'#b06a50');if(o.scars>1)P(-2,-10,2,1,'#b06a50');if(o.scars>2)P(-1,-12,1,1,'#b06a50');}
 if(o.helmet){P(-2,-13,4,2,'#b08a3a');P(-1,-15,2,2,o.crest||'#a8322a');}
 if(o.crown){P(-2,-13,4,1,'#e0b15a');P(-2,-14,1,1,'#e0b15a');P(0,-14,1,1,'#e0b15a');P(1,-14,1,1,'#e0b15a');}
 if(o.pike){P(4,-24,1,22,'#6a4a2a');P(4,-25,1,2,'#cfcfcf');}
 else if(o.spear){P(4,-16,1,14,'#6a4a2a');P(4,-17,1,2,'#cfcfcf');}
 if(o.bow){P(4,-11,1,7,'#7a5a32');P(5,-12,1,1,'#7a5a32');P(5,-4,1,1,'#7a5a32');}
 if(o.shield){P(-6,-8,3,5,o.shield);P(-5,-7,1,3,o.trim||'#e0b15a');}
 if(o.staff){P(4,-14,1,12,'#6a4a2a');}
 if(o.banner){P(4,-22,1,20,'#4a3420');P(5,-22,5,4,o.banner);P(5,-22,5,1,o.trim||'#fff');}
}
function drawWagon(sx,sy,sc,face){
 const z=Z*sc;const P=(ax,ay,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(Math.round(sx+ax*z),Math.round(sy+ay*z),Math.ceil(w*z),Math.ceil(h*z));};

 }
 requestAnimationFrame(frame);
}
